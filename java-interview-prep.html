d: {}\", dropped))\n    .subscribe(item -> slowProcess(item));\n\n// onBackpressureLatest \u2014 keep only the most recent item\nFlux.interval(Duration.ofMillis(1))\n    .onBackpressureLatest()\n    .subscribe(item -> slowProcess(item));\n\n// onBackpressureError \u2014 throw OverflowException when subscriber can't keep up\nFlux.range(1, 1_000_000)\n    .onBackpressureError()\n    .subscribe(System.out::println);\n```\n\nLimiting rate of production:\n```java\n// limitRate \u2014 subscriber requests items in batches of n\nFlux.range(1, 1000)\n    .limitRate(10) // requests 10 at a time from upstream\n    .subscribe(System.out::println);\n```\n\nReal-world example \u2014 database result streaming:\n```java\n// Without backpressure: all rows loaded into memory\nuserRepository.findAll() // Flux<User>\n    .limitRate(100)       // fetch 100 rows at a time from DB\n    .flatMap(user -> processUser(user), 10) // concurrency=10\n    .subscribe();\n```\n\n\ud83d\udccc Most WebFlux HTTP endpoints handle backpressure automatically \u2014 Netty's network layer signals demand to the Flux. Explicit backpressure strategies are mainly needed when bridging reactive and non-reactive code."}, {"q": "How does error handling work in reactive streams?", "a": "Errors in Reactor are terminal events \u2014 once an error occurs, the stream stops. Reactor provides several operators to handle and recover from errors.\n\nonErrorReturn \u2014 return a fallback value on error:\n```java\nMono.just(\"userId\")\n    .flatMap(id -> userRepository.findById(id))\n    .onErrorReturn(new User(\"fallback\", \"fallback@example.com\"))\n    .subscribe(System.out::println);\n```\n\nonErrorResume \u2014 switch to a fallback publisher on error:\n```java\nuserRepository.findById(id)\n    .onErrorResume(DatabaseException.class, ex -> {\n        log.warn(\"DB unavailable, using cache\", ex);\n        return cacheService.getUser(id);\n    })\n    .onErrorResume(ex -> Mono.error(new ServiceException(\"User lookup failed\", ex)));\n```\n\nonErrorMap \u2014 transform one exception type to another:\n```java\nuserRepository.findById(id)\n    .onErrorMap(DataAccessException.class,\n        ex -> new ServiceException(\"Database error\", ex));\n```\n\ndoOnError \u2014 side effect on error (doesn't recover):\n```java\nuserRepository.findById(id)\n    .doOnError(ex -> log.error(\"Error fetching user {}\", id, ex))\n    .subscribe();\n```\n\nretry \u2014 resubscribe on error:\n```java\nexternalApiClient.call()\n    .retry(3)                   // retry up to 3 times immediately\n    .retryWhen(Retry.backoff(3, Duration.ofSeconds(1))\n        .maxBackoff(Duration.ofSeconds(10))\n        .filter(ex -> ex instanceof TransientException))\n    .subscribe();\n```\n\nUsing Mono.error with switchIfEmpty:\n```java\nuserRepository.findById(id)\n    .switchIfEmpty(Mono.error(new NotFoundException(\"User \" + id + \" not found\")));\n```\n\nGlobal error handling in WebFlux (@RestControllerAdvice):\n```java\n@RestControllerAdvice\npublic class GlobalErrorHandler {\n\n    @ExceptionHandler(NotFoundException.class)\n    @ResponseStatus(HttpStatus.NOT_FOUND)\n    public Mono<ErrorResponse> handleNotFound(NotFoundException ex) {\n        return Mono.just(new ErrorResponse(\"NOT_FOUND\", ex.getMessage()));\n    }\n\n    @ExceptionHandler(WebExchangeBindException.class)\n    @ResponseStatus(HttpStatus.BAD_REQUEST)\n    public Mono<ErrorResponse> handleValidation(WebExchangeBindException ex) {\n        String msg = ex.getBindingResult().getFieldErrors().stream()\n            .map(FieldError::getDefaultMessage)\n            .collect(Collectors.joining(\", \"));\n        return Mono.just(new ErrorResponse(\"VALIDATION_ERROR\", msg));\n    }\n}\n```\n\n\ud83d\udccc Never throw exceptions inside reactive operators \u2014 use Mono.error() instead. Unchecked exceptions thrown inside map/flatMap are caught by Reactor and converted to error signals."}, {"q": "What is Server-Sent Events (SSE) and how do you implement it in WebFlux?", "a": "Server-Sent Events (SSE) is a standard HTTP protocol for the server to push a stream of events to the client over a single long-lived HTTP connection. WebFlux makes SSE trivial to implement using Flux.\n\nHow SSE works:\n\u2022 Client opens a single HTTP GET connection.\n\u2022 Server keeps the connection open and pushes event: data\n\n frames.\n\u2022 Client's EventSource API in browser receives events in real-time.\n\u2022 One-way: server \u2192 client only (for bidirectional, use WebSocket).\n\nSpring WebFlux SSE endpoint:\n```java\n@RestController\n@RequestMapping(\"/api/events\")\npublic class EventStreamController {\n\n    // Simple infinite stream \u2014 sends a number every second\n    @GetMapping(value = \"/ticker\", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n    public Flux<ServerSentEvent<String>> ticker() {\n        return Flux.interval(Duration.ofSeconds(1))\n            .map(seq -> ServerSentEvent.<String>builder()\n                .id(String.valueOf(seq))\n                .event(\"tick\")\n                .data(\"Tick #\" + seq + \" at \" + LocalTime.now())\n                .build());\n    }\n\n    // Real-world: live order status updates\n    @GetMapping(value = \"/orders/{id}/status\", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n    public Flux<ServerSentEvent<OrderStatus>> orderStatusStream(@PathVariable Long id) {\n        return orderService.getStatusStream(id)\n            .map(status -> ServerSentEvent.<OrderStatus>builder()\n                .event(\"order-status\")\n                .data(status)\n                .build())\n            .timeout(Duration.ofMinutes(10)); // close after 10 min\n    }\n\n    // Simple Flux<String> \u2014 Spring auto-wraps as SSE\n    @GetMapping(value = \"/logs\", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n    public Flux<String> logs() {\n        return logService.streamLogs(); // Flux<String>\n    }\n}\n```\n\nBrowser JavaScript:\n```javascript\nconst es = new EventSource('/api/events/ticker');\nes.addEventListener('tick', event => {\n    console.log('Received:', event.data);\n});\nes.onerror = () => es.close();\n```\n\nService generating the stream:\n```java\n@Service\npublic class OrderService {\n    private final Map<Long, Sinks.Many<OrderStatus>> sinks = new ConcurrentHashMap<>();\n\n    public Flux<OrderStatus> getStatusStream(Long orderId) {\n        Sinks.Many<OrderStatus> sink = sinks.computeIfAbsent(orderId,\n            id -> Sinks.many().multicast().onBackpressureBuffer());\n        return sink.asFlux();\n    }\n\n    public void updateStatus(Long orderId, OrderStatus status) {\n        Sinks.Many<OrderStatus> sink = sinks.get(orderId);\n        if (sink != null) sink.tryEmitNext(status);\n    }\n}\n```\n\n\ud83d\udccc SSE is ideal for dashboards, live feeds, progress bars, and notifications. For bidirectional communication (chat, gaming), use WebSocket."}, {"q": "What is WebClient and how does it differ from RestTemplate?", "a": "WebClient is Spring WebFlux's non-blocking HTTP client, introduced as the modern replacement for the deprecated RestTemplate.\n\nRestTemplate vs WebClient:\n\nFeature          | RestTemplate           | WebClient\n-----------------|------------------------|---------------------------\nBlocking         | Yes                    | No (non-blocking by default)\nReactive support | No                     | Yes (returns Mono/Flux)\nStreaming        | Limited                | Full streaming support\nStatus           | Maintenance mode       | Actively maintained\nThread model     | Thread-per-request     | Event loop\n\nBasic usage:\n```java\nWebClient client = WebClient.builder()\n    .baseUrl(\"https://api.example.com\")\n    .defaultHeader(HttpHeaders.CONTENT_TYPE, MediaType.APPLICATION_JSON_VALUE)\n    .codecs(configurer -> configurer.defaultCodecs().maxInMemorySize(2 * 1024 * 1024))\n    .build();\n\n// GET \u2014 returns Mono<User>\nMono<User> user = client.get()\n    .uri(\"/users/{id}\", userId)\n    .retrieve()\n    .bodyToMono(User.class);\n\n// GET list \u2014 returns Flux<User>\nFlux<User> users = client.get()\n    .uri(\"/users\")\n    .retrieve()\n    .bodyToFlux(User.class);\n\n// POST\nMono<Order> created = client.post()\n    .uri(\"/orders\")\n    .bodyValue(orderDto)\n    .retrieve()\n    .bodyToMono(Order.class);\n```\n\nError handling with WebClient:\n```java\nclient.get()\n    .uri(\"/users/{id}\", id)\n    .retrieve()\n    .onStatus(HttpStatus::is4xxClientError, response ->\n        response.bodyToMono(ErrorBody.class)\n            .flatMap(err -> Mono.error(new ClientException(err.getMessage()))))\n    .onStatus(HttpStatus::is5xxServerError, response ->\n        Mono.error(new ServerException(\"Upstream error\")))\n    .bodyToMono(User.class)\n    .retryWhen(Retry.backoff(3, Duration.ofSeconds(1)));\n```\n\nUsing WebClient in Spring MVC (sync):\n```java\n// WebClient can also be used in non-reactive apps by blocking\nUser user = client.get()\n    .uri(\"/users/{id}\", id)\n    .retrieve()\n    .bodyToMono(User.class)\n    .block(); // blocks thread \u2014 acceptable in MVC, never do this in WebFlux\n```\n\nBean configuration with connection pool:\n```java\n@Bean\npublic WebClient webClient() {\n    HttpClient httpClient = HttpClient.create()\n        .option(ChannelOption.CONNECT_TIMEOUT_MILLIS, 5000)\n        .responseTimeout(Duration.ofSeconds(5))\n        .doOnConnected(conn ->\n            conn.addHandlerLast(new ReadTimeoutHandler(5))\n                .addHandlerLast(new WriteTimeoutHandler(5)));\n\n    return WebClient.builder()\n        .clientConnector(new ReactorClientHttpConnector(httpClient))\n        .build();\n}\n```\n\n\ud83d\udccc Use WebClient everywhere going forward \u2014 even in Spring MVC apps, it's the preferred HTTP client."}, {"q": "What are Sinks in Project Reactor and when do you use them?", "a": "Sinks are a programmatic way to push data into a reactive stream from outside the reactive pipeline \u2014 useful when data comes from imperative code (event listeners, REST calls, WebSocket messages).\n\nThink of a Sink as a reactive equivalent of a queue that feeds a Flux or Mono.\n\nCreating Sinks:\n```java\n// Unicast \u2014 single subscriber only\nSinks.Many<String> unicast = Sinks.many().unicast().onBackpressureBuffer();\n\n// Multicast \u2014 multiple subscribers, buffers until first subscriber arrives\nSinks.Many<String> multicast = Sinks.many().multicast().onBackpressureBuffer();\n\n// Replay \u2014 replays last N items to late subscribers\nSinks.Many<String> replay = Sinks.many().replay().limit(10);\n\n// One \u2014 for Mono (single value)\nSinks.One<String> one = Sinks.one();\n```\n\nEmitting values:\n```java\nSinks.Many<String> sink = Sinks.many().multicast().onBackpressureBuffer();\n\n// Emit an item\nsink.tryEmitNext(\"hello\");\nsink.tryEmitNext(\"world\");\nsink.tryEmitComplete(); // signal completion\nsink.tryEmitError(new RuntimeException(\"oops\")); // signal error\n\n// Thread-safe emission\nSinks.EmitResult result = sink.tryEmitNext(\"item\");\nif (result.isFailure()) {\n    log.warn(\"Emission failed: {}\", result);\n}\n```\n\nReal-world use case \u2014 live notification stream:\n```java\n@Service\npublic class NotificationService {\n\n    private final Sinks.Many<Notification> sink =\n        Sinks.many().multicast().onBackpressureBuffer();\n\n    // Called from REST endpoint or event listener (imperative code)\n    public void sendNotification(Notification notification) {\n        sink.tryEmitNext(notification);\n    }\n\n    // Consumed by SSE endpoint\n    public Flux<Notification> getStream() {\n        return sink.asFlux();\n    }\n}\n\n@RestController\npublic class NotificationController {\n    @GetMapping(value = \"/notifications\", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n    public Flux<Notification> stream() {\n        return notificationService.getStream();\n    }\n\n    @PostMapping(\"/notify\")\n    public Mono<Void> notify(@RequestBody Notification notification) {\n        notificationService.sendNotification(notification);\n        return Mono.empty();\n    }\n}\n```\n\n\ud83d\udccc Sinks replaced the deprecated EmitterProcessor and UnicastProcessor from Reactor 3.4+. Always prefer Sinks for programmatic emission into a reactive stream."}, {"q": "How does reactive transaction management work in Spring WebFlux?", "a": "Reactive transaction management uses a different mechanism than the traditional @Transactional in Spring MVC because WebFlux is non-blocking and cannot use ThreadLocal (which is how Spring MVC propagates transactions).\n\nHow it works:\n\u2022 Spring WebFlux uses Reactor Context (not ThreadLocal) to propagate transaction state.\n\u2022 @Transactional on reactive methods still works \u2014 Spring wraps the reactive pipeline.\n\u2022 Requires a reactive-capable transaction manager (R2dbc, MongoDB Reactive, etc.).\n\nSetup with R2DBC:\n```java\n@Bean\npublic ReactiveTransactionManager transactionManager(ConnectionFactory cf) {\n    return new R2dbcTransactionManager(cf);\n}\n```\n\nUsing @Transactional on reactive methods:\n```java\n@Service\npublic class TransferService {\n\n    @Transactional\n    public Mono<Void> transfer(Long fromId, Long toId, BigDecimal amount) {\n        return accountRepo.findById(fromId)\n            .flatMap(from -> {\n                from.debit(amount);\n                return accountRepo.save(from);\n            })\n            .then(accountRepo.findById(toId))\n            .flatMap(to -> {\n                to.credit(amount);\n                return accountRepo.save(to);\n            })\n            .then();\n        // If any step fails \u2192 transaction rolls back\n    }\n}\n```\n\nProgrammatic reactive transactions (TransactionalOperator):\n```java\n@Service\npublic class OrderService {\n\n    private final TransactionalOperator txOp;\n\n    public OrderService(ReactiveTransactionManager txManager) {\n        this.txOp = TransactionalOperator.create(txManager);\n    }\n\n    public Mono<Order> createOrder(OrderDto dto) {\n        Mono<Order> operation = orderRepo.save(new Order(dto))\n            .flatMap(order -> inventoryRepo.deduct(dto.getItemId()).thenReturn(order));\n\n        return txOp.transactional(operation);\n    }\n}\n```\n\nCommon pitfalls:\n```java\n// WRONG \u2014 transaction context lost after flatMap crosses thread boundary\n@Transactional\npublic Mono<Void> process() {\n    return Mono.just(\"data\")\n        .publishOn(Schedulers.boundedElastic()) // switches thread \u2014 loses context!\n        .flatMap(data -> repo.save(data));\n}\n\n// CORRECT \u2014 use subscribeOn instead, or avoid scheduler switches inside @Transactional\n```\n\n\ud83d\udccc @Transactional works on reactive return types (Mono/Flux) only if the transaction manager is reactive. Mixing blocking JDBC/JPA with reactive transactions is not possible."}, {"q": "How do you test Spring WebFlux controllers and services?", "a": "WebFlux provides WebTestClient \u2014 a non-blocking test client that can test both mock MVC and real servers.\n\nTesting with @WebFluxTest (slice test \u2014 controller layer only):\n```java\n@WebFluxTest(UserController.class)\nclass UserControllerTest {\n\n    @Autowired\n    WebTestClient webTestClient;\n\n    @MockBean\n    UserService userService;\n\n    @Test\n    void shouldReturnUserWhenFound() {\n        User user = new User(1L, \"Alice\", \"alice@example.com\");\n        when(userService.findById(1L)).thenReturn(Mono.just(user));\n\n        webTestClient.get()\n            .uri(\"/api/users/1\")\n            .exchange()\n            .expectStatus().isOk()\n            .expectBody(User.class)\n            .value(u -> assertThat(u.getName()).isEqualTo(\"Alice\"));\n    }\n\n    @Test\n    void shouldReturn404WhenUserNotFound() {\n        when(userService.findById(99L)).thenReturn(Mono.empty());\n\n        webTestClient.get()\n            .uri(\"/api/users/99\")\n            .exchange()\n            .expectStatus().isNotFound();\n    }\n\n    @Test\n    void shouldCreateUserAndReturn201() {\n        UserDto dto = new UserDto(\"Bob\", \"bob@example.com\");\n        User saved  = new User(2L, \"Bob\", \"bob@example.com\");\n        when(userService.create(any())).thenReturn(Mono.just(saved));\n\n        webTestClient.post()\n            .uri(\"/api/users\")\n            .contentType(MediaType.APPLICATION_JSON)\n            .bodyValue(dto)\n            .exchange()\n            .expectStatus().isCreated()\n            .expectBody().jsonPath(\"$.name\").isEqualTo(\"Bob\");\n    }\n}\n```\n\nTesting Flux (streaming responses):\n```java\n@Test\nvoid shouldStreamAllUsers() {\n    Flux<User> users = Flux.just(new User(1L, \"Alice\"), new User(2L, \"Bob\"));\n    when(userService.findAll()).thenReturn(users);\n\n    webTestClient.get()\n        .uri(\"/api/users\")\n        .exchange()\n        .expectStatus().isOk()\n        .expectBodyList(User.class)\n        .hasSize(2)\n        .contains(new User(1L, \"Alice\"));\n}\n```\n\nUnit testing reactive services with StepVerifier:\n```java\n@Test\nvoid shouldFindActiveUsers() {\n    when(userRepo.findByActive(true)).thenReturn(\n        Flux.just(new User(\"Alice\"), new User(\"Bob\"))\n    );\n\n    StepVerifier.create(userService.findActiveUsers())\n        .expectNextMatches(u -> u.getName().equals(\"Alice\"))\n        .expectNextMatches(u -> u.getName().equals(\"Bob\"))\n        .expectComplete()\n        .verify();\n}\n\n@Test\nvoid shouldEmitErrorWhenUserNotFound() {\n    when(userRepo.findById(99L)).thenReturn(Mono.empty());\n\n    StepVerifier.create(userService.findById(99L))\n        .expectError(NotFoundException.class)\n        .verify();\n}\n```\n\nTesting SSE:\n```java\n@Test\nvoid shouldStreamServerSentEvents() {\n    webTestClient.get()\n        .uri(\"/api/events/ticker\")\n        .accept(MediaType.TEXT_EVENT_STREAM)\n        .exchange()\n        .expectStatus().isOk()\n        .returnResult(ServerSentEvent.class)\n        .getResponseBody()\n        .take(3)\n        .as(StepVerifier::create)\n        .expectNextCount(3)\n        .thenCancel()\n        .verify();\n}\n```\n\n\ud83d\udccc StepVerifier is the core tool for unit-testing Mono/Flux. WebTestClient is for integration testing HTTP endpoints. Always call .verify() \u2014 it throws if the stream doesn't complete as expected."}, {"q": "What is the difference between subscribeOn and publishOn in Reactor?", "a": "Both operators control on which Scheduler (thread pool) a reactive pipeline runs, but they affect different parts of the pipeline.\n\npublishOn \u2014 affects downstream operators (everything AFTER it):\n```java\nFlux.just(1, 2, 3)\n    .map(n -> {\n        System.out.println(\"map1 on \" + Thread.currentThread().getName()); // main\n        return n * 2;\n    })\n    .publishOn(Schedulers.boundedElastic())\n    .map(n -> {\n        System.out.println(\"map2 on \" + Thread.currentThread().getName()); // boundedElastic\n        return n + 1;\n    })\n    .subscribe(n -> System.out.println(\"subscribe on \" + Thread.currentThread().getName())); // boundedElastic\n```\n\nsubscribeOn \u2014 affects the source subscription and everything upstream:\n```java\nFlux.fromCallable(() -> {\n    System.out.println(\"source on \" + Thread.currentThread().getName()); // boundedElastic\n    return readHeavyFile(); // blocking I/O\n})\n.subscribeOn(Schedulers.boundedElastic()) // moves the source onto this scheduler\n.map(content -> process(content))         // also on boundedElastic\n.subscribe(System.out::println);\n```\n\nKey rule: subscribeOn affects where the subscription starts (source), publishOn affects where downstream runs. Only the FIRST subscribeOn matters; multiple subscribeOn calls are ignored by the first one.\n\nBuilt-in Schedulers:\n```java\nSchedulers.parallel()          // CPU-bound tasks \u2014 fixed thread pool (N CPUs)\nSchedulers.boundedElastic()    // I/O-bound / blocking tasks \u2014 dynamic thread pool (capped)\nSchedulers.single()            // Single dedicated thread\nSchedulers.immediate()         // Current thread (no switching)\nSchedulers.fromExecutorService(executor) // custom executor\n```\n\nWrapping blocking calls correctly:\n```java\n// NEVER block the event loop thread \u2014 always offload to boundedElastic\nMono<String> result = Mono.fromCallable(() -> blockingDbCall()) // blocking operation\n    .subscribeOn(Schedulers.boundedElastic()); // run on I/O thread pool\n\n// Using Mono.fromCallable wraps any blocking Callable safely\nMono.fromCallable(() -> Files.readString(Path.of(\"data.txt\")))\n    .subscribeOn(Schedulers.boundedElastic())\n    .subscribe(System.out::println);\n```\n\n\ud83d\udccc In WebFlux, never call blocking APIs on the event-loop thread. If you must use blocking code (JDBC, file I/O), always wrap in Mono.fromCallable() + subscribeOn(Schedulers.boundedElastic())."}, {"q": "What is the difference between cold and hot publishers in Reactor?", "a": "Cold and hot publishers differ in when they start producing data and whether data is shared across subscribers.\n\nCold Publisher \u2014 starts producing data for EACH subscriber independently:\n```java\n// Each subscriber gets a fresh, independent stream from the beginning\nFlux<Integer> cold = Flux.range(1, 5);\n\ncold.subscribe(n -> System.out.println(\"Sub1: \" + n)); // 1,2,3,4,5\ncold.subscribe(n -> System.out.println(\"Sub2: \" + n)); // 1,2,3,4,5 (replays from start)\n\n// HTTP calls are cold \u2014 each subscription triggers a new request\nMono<User> coldHttp = webClient.get().uri(\"/user/1\").retrieve().bodyToMono(User.class);\ncoldHttp.subscribe(); // makes HTTP request\ncoldHttp.subscribe(); // makes ANOTHER HTTP request\n```\n\nHot Publisher \u2014 produces data regardless of subscribers; late subscribers miss past data:\n```java\n// Sinks.many().multicast() is a hot publisher\nSinks.Many<String> sink = Sinks.many().multicast().onBackpressureBuffer();\nFlux<String> hot = sink.asFlux();\n\nhot.subscribe(s -> System.out.println(\"Sub1: \" + s));\n\nsink.tryEmitNext(\"A\"); // Sub1 receives A\nsink.tryEmitNext(\"B\"); // Sub1 receives B\n\nhot.subscribe(s -> System.out.println(\"Sub2: \" + s)); // Sub2 joins LATE\n\nsink.tryEmitNext(\"C\"); // Both Sub1 and Sub2 receive C\n// Sub2 missed A and B\n```\n\nConverting cold to hot with share() and publish():\n```java\n// share() \u2014 multicast cold Flux to multiple subscribers, starts on first subscribe\nFlux<Long> shared = Flux.interval(Duration.ofSeconds(1)).share();\n\nshared.subscribe(n -> System.out.println(\"A: \" + n)); // A starts here\nThread.sleep(3000);\nshared.subscribe(n -> System.out.println(\"B: \" + n)); // B joins, misses first 3 ticks\n\n// publish().autoConnect(n) \u2014 starts when n subscribers have subscribed\nFlux<Long> connected = Flux.interval(Duration.ofSeconds(1))\n    .publish()\n    .autoConnect(2); // waits for 2 subscribers before emitting\n\n// publish().refCount(n) \u2014 starts at n subscribers, stops when drops to 0\nFlux<Long> refCounted = Flux.interval(Duration.ofSeconds(1))\n    .publish()\n    .refCount(1);\n\n// replay() \u2014 hot but replays N items to late subscribers\nFlux<Long> replayed = Flux.interval(Duration.ofSeconds(1))\n    .replay(5)      // buffer last 5 items\n    .autoConnect();\n```\n\n\ud83d\udccc Most Reactor sources (Flux.just, Flux.range, DB queries, HTTP calls) are cold. SSE streams, WebSocket messages, and Sinks are hot. Use share() when you want multiple subscribers to share one upstream subscription."}, {"q": "How do you configure security in a Spring WebFlux application?", "a": "Spring Security supports reactive applications through the spring-security-webflux module, using a reactive filter chain instead of the servlet-based SecurityFilterChain.\n\nDependencies:\n```xml\n<dependency>\n    <groupId>org.springframework.boot<\/groupId>\n    <artifactId>spring-boot-starter-security<\/artifactId>\n<\/dependency>\n```\n\nReactive Security Configuration:\n```java\n@Configuration\n@EnableWebFluxSecurity\npublic class SecurityConfig {\n\n    @Bean\n    public SecurityWebFilterChain securityWebFilterChain(ServerHttpSecurity http) {\n        return http\n            .csrf(csrf -> csrf.disable())             // disable for stateless JWT API\n            .authorizeExchange(auth -> auth\n                .pathMatchers(\"/api/auth/**\").permitAll()\n                .pathMatchers(\"/api/admin/**\").hasRole(\"ADMIN\")\n                .pathMatchers(HttpMethod.GET, \"/api/products/**\").permitAll()\n                .anyExchange().authenticated()\n            )\n            .sessionManagement(s -> s\n                .sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n            .addFilterAt(jwtAuthFilter, SecurityWebFiltersOrder.AUTHENTICATION)\n            .build();\n    }\n\n    @Bean\n    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder(12);\n    }\n}\n```\n\nReactive JWT Authentication Filter:\n```java\n@Component\npublic class JwtAuthFilter implements WebFilter {\n\n    private final JwtUtil jwtUtil;\n    private final ReactiveUserDetailsService userDetailsService;\n\n    @Override\n    public Mono<Void> filter(ServerWebExchange exchange, WebFilterChain chain) {\n        String token = extractToken(exchange.getRequest());\n        if (token == null) return chain.filter(exchange);\n\n        return Mono.just(jwtUtil.extractUsername(token))\n            .flatMap(username -> userDetailsService.findByUsername(username))\n            .filter(userDetails -> jwtUtil.isValid(token, userDetails))\n            .map(userDetails -> new UsernamePasswordAuthenticationToken(\n                userDetails, null, userDetails.getAuthorities()))\n            .flatMap(auth -> {\n                SecurityContext context = new SecurityContextImpl(auth);\n                return chain.filter(exchange)\n                    .contextWrite(ReactiveSecurityContextHolder.withSecurityContext(Mono.just(context)));\n            })\n            .switchIfEmpty(chain.filter(exchange));\n    }\n}\n```\n\nAccessing authenticated user in controllers:\n```java\n@GetMapping(\"/me\")\npublic Mono<User> getCurrentUser(@AuthenticationPrincipal Mono<UserDetails> principal) {\n    return principal.map(u -> (User) u);\n}\n\n// Or via ReactiveSecurityContextHolder\n@GetMapping(\"/me\")\npublic Mono<String> whoAmI() {\n    return ReactiveSecurityContextHolder.getContext()\n        .map(ctx -> ctx.getAuthentication().getName());\n}\n```\n\nMethod-level security:\n```java\n@Configuration\n@EnableReactiveMethodSecurity\npublic class MethodSecurityConfig {}\n\n@Service\npublic class OrderService {\n    @PreAuthorize(\"hasRole('ADMIN')\")\n    public Flux<Order> getAllOrders() { ... }\n\n    @PreAuthorize(\"#userId == authentication.principal.id\")\n    public Flux<Order> getOrdersForUser(Long userId) { ... }\n}\n```\n\n\ud83d\udccc Key difference from MVC security: use SecurityWebFilterChain (not SecurityFilterChain), ServerHttpSecurity (not HttpSecurity), and ReactiveSecurityContextHolder (not SecurityContextHolder)."}]}
</script>

const questions = JSON.parse(document.getElementById("qa-data").textContent);

// ── State ──────────────────────────────────────────────────
let activeCategory = "core";
let openIndex = null;
let searchTerm = "";

// ── Helpers ────────────────────────────────────────────────
function totalCount() {
  return Object.values(questions).flat().length;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderAnswerHtml(raw) {
  var parts = raw.split(/(```[\s\S]*?```)/g);
  return parts.map(function(chunk) {
    if (chunk.startsWith("```")) {
      var code = chunk.replace(/```\w*\n?/, "").replace(/```$/, "").trim();
      return "<pre>" + escapeHtml(code) + "</pre>";
    }
    return chunk.split("\n").map(function(line) {
      var safe = escapeHtml(line).replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      return "<p>" + safe + "</p>";
    }).join("");
  }).join("");
}

// ── Render ─────────────────────────────────────────────────
function render() {
  var all = questions[activeCategory] || [];
  var filtered = searchTerm
    ? all.filter(function(item) {
        return item.q.toLowerCase().indexOf(searchTerm) !== -1 ||
               item.a.toLowerCase().indexOf(searchTerm) !== -1;
      })
    : all;

  var catLabel = "";
  for (var i = 0; i < categories.length; i++) {
    if (categories[i].id === activeCategory) { catLabel = categories[i].label; break; }
  }
  document.getElementById("meta").innerHTML =
    "Showing <strong>" + filtered.length + "</strong> question" + (filtered.length !== 1 ? "s" : "") +
    (searchTerm ? " matching <em>" + escapeHtml(searchTerm) + "</em>" : " in " + catLabel);

  var list = document.getElementById("questions-list");
  if (filtered.length === 0) {
    list.innerHTML = "<div class=\"no-results\">No questions found for <strong>" + escapeHtml(searchTerm) + "</strong></div>";
    return;
  }
  list.innerHTML = filtered.map(function(item, i) {
    var isOpen = openIndex === i;
    return "<div class=\"card" + (isOpen ? " open" : "") + "\" id=\"card-" + i + "\">" +
      "<button class=\"question-btn\" onclick=\"toggle(" + i + ")\">" +
        "<div class=\"q-left\">" +
          "<span class=\"q-num\">Q" + (i+1) + "</span>" +
          "<span class=\"q-text\">" + escapeHtml(item.q) + "</span>" +
        "</div>" +
        "<span class=\"chevron\">&#8964;</span>" +
      "</button>" +
      "<div class=\"answer-wrap\">" +
        "<div class=\"answer-box\">" + renderAnswerHtml(item.a) + "</div>" +
        "<a href=\"#\" class=\"go-top\" onclick=\"window.scrollTo({top:0,behavior:'smooth'});return false;\">&#8593; Back to top</a>" +
      "</div>" +
    "</div>";
  }).join("");
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = categories.map(function(cat) {
    return "<button class=\"tab" + (cat.id === activeCategory ? " active" : "") +
           "\" onclick=\"switchTab('" + cat.id + "')\">" + cat.icon + " " + cat.label + "</button>";
  }).join("");
}

// ── Events ─────────────────────────────────────────────────
function toggle(i) {
  openIndex = openIndex === i ? null : i;
  render();
}

function switchTab(id) {
  activeCategory = id;
  openIndex = null;
  searchTerm = "";
  document.getElementById("search").value = "";
  renderTabs();
  render();
}

function onSearch() {
  searchTerm = document.getElementById("search").value.toLowerCase().trim();
  openIndex = null;
  render();
}

// ── Scroll: hide header when scrolled down ─────────────────
var headerEl = document.querySelector("header");
window.addEventListener("scroll", function() {
  if (window.scrollY > 80) {
    headerEl.classList.add("hidden");
  } else {
    headerEl.classList.remove("hidden");
  }
}, { passive: true });

// ── Init ───────────────────────────────────────────────────
var total = totalCount();
document.getElementById("total-count").textContent =
  total + " curated Q&As across " + categories.length + " topics";
document.getElementById("footer-text").textContent =
  categories.map(function(c) { return c.label; }).join(" · ");
renderTabs();
render();
</script>

</body>
</html>
