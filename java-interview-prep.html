    // 30\n```\n\nCustomization:\n```java\nrecord Person(String name, int age) {\n    // Compact constructor (validation)\n    Person {\n        if (age < 0) throw new IllegalArgumentException(\"Age cannot be negative\");\n        name = name.trim(); // can reassign params in compact constructor\n    }\n\n    // Additional methods allowed\n    String greeting() { return \"Hi, I am \" + name; }\n}\n```\n\nLimitations:\n\u2022 Cannot extend other classes (implicitly extends Record).\n\u2022 All fields are final \u2014 truly immutable.\n\u2022 Cannot declare instance fields outside the component list.\n\u2022 Cannot be abstract."}, {"q": "What are Sealed Classes and how do they work with pattern matching?", "a": "Sealed classes restrict which classes can extend or implement them. Declared with the sealed keyword and a permits clause.\n\n```java\npublic sealed interface Expr permits Num, Add, Mul {}\n\npublic record Num(int value)         implements Expr {}\npublic record Add(Expr left, Expr right) implements Expr {}\npublic record Mul(Expr left, Expr right) implements Expr {}\n```\n\nPermitted subclasses must be: final, sealed, or non-sealed.\n\nPower with switch pattern matching (Java 21):\n```java\nstatic int eval(Expr expr) {\n    return switch (expr) {\n        case Num(int v)           -> v;\n        case Add(var l, var r)    -> eval(l) + eval(r);\n        case Mul(var l, var r)    -> eval(l) * eval(r);\n    }; // compiler verifies exhaustiveness \u2014 no default needed!\n}\n```\n\n\ud83d\udccc Sealed + Records + Pattern Matching together enable Algebraic Data Types (ADTs) \u2014 a paradigm common in functional languages (Haskell, Scala) now available in Java."}, {"q": "What are the key features in Java 19, 20, and 21 (LTS)?", "a": "Java 21 (September 2023) is the latest LTS release. Key finalized features:\n\n1. Virtual Threads (Project Loom \u2014 standard in Java 21):\n```java\n// Lightweight threads \u2014 millions can run concurrently\nThread.ofVirtual().start(() -> handleRequest());\n\n// With ExecutorService\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n    executor.submit(() -> processTask());\n}\n```\n\n2. Sequenced Collections \u2014 new interfaces for ordered access:\n```java\nSequencedCollection<String> sc = new ArrayList<>(List.of(\"A\",\"B\",\"C\"));\nsc.getFirst(); // \"A\"\nsc.getLast();  // \"C\"\nsc.reversed(); // reversed view\n```\n\n3. Record Patterns (standard):\n```java\nif (obj instanceof Point(int x, int y)) {\n    System.out.println(x + \", \" + y); // destructuring\n}\n```\n\n4. Pattern Matching for switch (standard).\n5. String Templates (preview in 21 \u2014 standard expected in 23)."}, {"q": "What are Virtual Threads (Project Loom) and why are they significant?", "a": "Virtual Threads (Java 21) are lightweight, JVM-managed threads that allow massive concurrency without the overhead of OS threads.\n\nTraditional (Platform) Thread:\n\u2022 1 Java thread = 1 OS thread = ~1MB stack memory.\n\u2022 A server with 10,000 concurrent requests needs 10,000 OS threads \u2014 very expensive.\n\nVirtual Thread:\n\u2022 Managed by the JVM, not the OS.\n\u2022 Mounted on a carrier (OS) thread only when running \u2014 unmounted during blocking I/O.\n\u2022 Can create MILLIONS of virtual threads cheaply.\n\n```java\n// Create a virtual thread\nThread vt = Thread.ofVirtual().name(\"my-virtual\").start(() -> {\n    System.out.println(\"Running on: \" + Thread.currentThread());\n});\n\n// Virtual thread executor \u2014 one thread per task\ntry (var exec = Executors.newVirtualThreadPerTaskExecutor()) {\n    IntStream.range(0, 100_000).forEach(i ->\n        exec.submit(() -> processRequest(i))  // 100k virtual threads!\n    );\n}\n```\n\n\ud83d\udccc Virtual threads are a game-changer for I/O-bound applications. They allow \"thread-per-request\" style code (simpler than reactive) with the scalability of async programming. Spring Boot 3.2+ supports virtual threads natively."}, {"q": "What are Text Blocks in Java and how do they differ from regular Strings?", "a": "Text Blocks (standard in Java 15) are multi-line string literals that preserve formatting and eliminate escape clutter.\n\n```java\n// Old way \u2014 messy escaping\nString json = \"{\n  \\\"name\\\": \\\"Alice\\\",\n  \\\"age\\\": 30\n}\";\n\n// Text Block \u2014 clean and readable\nString json = \"\"\"\n        {\n          \"name\": \"Alice\",\n          \"age\": 30\n        }\n        \"\"\";\n```\n\nKey rules:\n\u2022 Opening \"\"\" must be followed by a newline.\n\u2022 Indentation is stripped based on the least-indented line (incidental whitespace removal).\n\u2022 Closing \"\"\" position controls trailing newline.\n\nUseful for: SQL, JSON, HTML, XML, YAML embedded in Java code.\n```java\nString sql = \"\"\"\n    SELECT u.name, u.email\n    FROM users u\n    WHERE u.active = true\n    ORDER BY u.name\n    \"\"\";\n\nString html = \"\"\"\n    <html>\n        <body><p>Hello, %s!<\/p><\/body>\n    <\/html>\n    \"\"\".formatted(\"Alice\");\n```"}, {"q": "What is the new HttpClient API introduced in Java 11?", "a": "Java 11 finalized the HttpClient API (incubated in Java 9) as a modern replacement for HttpURLConnection.\n\nFeatures:\n\u2022 Supports HTTP/1.1 and HTTP/2.\n\u2022 Synchronous and asynchronous (CompletableFuture) requests.\n\u2022 WebSocket support.\n\u2022 Immutable and thread-safe.\n\n```java\n// Create client\nHttpClient client = HttpClient.newBuilder()\n    .version(HttpClient.Version.HTTP_2)\n    .connectTimeout(Duration.ofSeconds(10))\n    .build();\n\n// Synchronous GET\nHttpRequest request = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://api.example.com/users\"))\n    .header(\"Accept\", \"application/json\")\n    .GET()\n    .build();\n\nHttpResponse<String> response = client.send(request, BodyHandlers.ofString());\nSystem.out.println(response.statusCode()); // 200\nSystem.out.println(response.body());\n\n// Asynchronous POST\nHttpRequest post = HttpRequest.newBuilder()\n    .uri(URI.create(\"https://api.example.com/users\"))\n    .POST(BodyPublishers.ofString(\"{\\\"name\\\":\\\"Alice\\\"}\"))\n    .header(\"Content-Type\", \"application/json\")\n    .build();\n\nclient.sendAsync(post, BodyHandlers.ofString())\n      .thenApply(HttpResponse::body)\n      .thenAccept(System.out::println);\n```"}, {"q": "What is the var keyword in Java 10 and what are its rules and limitations?", "a": "var enables Local Variable Type Inference \u2014 the compiler infers the type from the right-hand side expression.\n\n```java\nvar list    = new ArrayList<String>();       // ArrayList<String>\nvar map     = new HashMap<String, Integer>(); // HashMap<String, Integer>\nvar name    = \"Alice\";                       // String\nvar number  = 42;                            // int\nvar stream  = list.stream();                 // Stream<String>\n\n// In for loops\nfor (var item : list) { ... }\nfor (var i = 0; i < 10; i++) { ... }\n```\n\nRules and limitations:\n\u2022 ONLY for local variables \u2014 NOT for fields, method parameters, or return types.\n\u2022 Must be initialized at declaration (compiler needs the type).\n\u2022 Cannot be assigned null without a cast (type cannot be inferred from null).\n\u2022 Cannot use with lambda expressions directly: var fn = x -> x * 2; // Error\n\u2022 var is NOT a keyword \u2014 it's a reserved type name, so var var = 5; is valid (but terrible practice).\n\n```java\n// Lambda parameter var (Java 11+)\nlist.stream().map((var s) -> s.toUpperCase()); // allows @Nonnull var s\n```"}, {"q": "What are Sequenced Collections introduced in Java 21?", "a": "Sequenced Collections (Java 21) introduced three new interfaces to provide uniform access to the first and last elements of ordered collections.\n\nNew interfaces:\n\u2022 SequencedCollection<E> \u2014 extends Collection\n\u2022 SequencedSet<E> \u2014 extends Set + SequencedCollection\n\u2022 SequencedMap<K,V> \u2014 extends Map\n\nNew methods:\n```java\nSequencedCollection<String> list = new ArrayList<>(List.of(\"A\", \"B\", \"C\"));\n\nlist.getFirst();     // \"A\"\nlist.getLast();      // \"C\"\nlist.addFirst(\"Z\");  // [Z, A, B, C]\nlist.addLast(\"X\");   // [Z, A, B, C, X]\nlist.removeFirst();  // removes Z\nlist.removeLast();   // removes X\nlist.reversed();     // reversed view [C, B, A]\n```\n\nWorks across:\n\u2022 List \u2192 ArrayList, LinkedList\n\u2022 Deque \u2192 ArrayDeque, LinkedList\n\u2022 SortedSet / NavigableSet \u2192 TreeSet\n\u2022 LinkedHashSet, LinkedHashMap\n\n\ud83d\udccc Before Java 21, getting the last element of a list required list.get(list.size() - 1) \u2014 now it's just list.getLast()."}], "memory": [{"q": "What is the JVM memory model? Explain all memory areas.", "a": "The JVM divides memory into several distinct regions, each serving a specific purpose.\n\n```\nJVM Memory Layout\n\u251c\u2500\u2500 Heap (shared across all threads)\n\u2502   \u251c\u2500\u2500 Young Generation\n\u2502   \u2502   \u251c\u2500\u2500 Eden Space       \u2190 new objects allocated here\n\u2502   \u2502   \u251c\u2500\u2500 Survivor S0      \u2190 objects that survived 1 GC\n\u2502   \u2502   \u2514\u2500\u2500 Survivor S1      \u2190 objects that survived 2 GC\n\u2502   \u2514\u2500\u2500 Old Generation       \u2190 long-lived objects promoted here\n\u2502\n\u251c\u2500\u2500 Non-Heap\n\u2502   \u251c\u2500\u2500 Metaspace            \u2190 class metadata (Java 8+, replaces PermGen)\n\u2502   \u251c\u2500\u2500 Code Cache           \u2190 JIT-compiled native code\n\u2502   \u2514\u2500\u2500 Compressed Class Ptr \u2190 pointer to class metadata\n\u2502\n\u251c\u2500\u2500 Stack (per thread)       \u2190 frames, local variables, references\n\u251c\u2500\u2500 PC Register (per thread) \u2190 current instruction pointer\n\u2514\u2500\u2500 Native Method Stack      \u2190 for native (JNI) methods\n```\n\nKey JVM flags for tuning:\n```bash\n-Xms512m              # initial heap size\n-Xmx2g                # max heap size\n-Xss512k              # thread stack size\n-XX:MetaspaceSize=128m        # initial metaspace\n-XX:MaxMetaspaceSize=512m     # max metaspace (unlimited by default!)\n-XX:NewRatio=3                # Old:Young ratio (3:1)\n-XX:SurvivorRatio=8           # Eden:Survivor ratio (8:1:1)\n```\n\n\ud83d\udccc Heap is GC-managed. Stack frames are freed automatically when methods return. Metaspace grows dynamically \u2014 always set MaxMetaspaceSize to avoid native memory exhaustion."}, {"q": "What is the difference between Stack and Heap memory?", "a": "Stack Memory:\n\u2022 One stack per thread \u2014 each method call creates a new stack frame.\n\u2022 Stores: local primitive variables, object references (not the objects), method call info.\n\u2022 LIFO \u2014 frame is pushed on call, popped on return.\n\u2022 Very fast allocation/deallocation \u2014 just moves a pointer.\n\u2022 Fixed size per thread (-Xss). StackOverflowError if exceeded (infinite recursion).\n\u2022 Memory freed automatically when method exits \u2014 no GC involved.\n\nHeap Memory:\n\u2022 Single shared heap \u2014 all threads read/write to it.\n\u2022 Stores: all object instances and arrays (created with new).\n\u2022 Managed by Garbage Collector \u2014 not freed immediately when unreferenced.\n\u2022 Slower allocation than stack, but much larger.\n\u2022 OutOfMemoryError: Java heap space if exhausted.\n\n```java\npublic void example() {\n    int x = 42;                    // x stored on STACK\n    String name = \"Alice\";         // reference 'name' on STACK, \"Alice\" object on HEAP\n    Person p = new Person(\"Bob\");  // reference 'p' on STACK, Person object on HEAP\n}\n// When method returns: x, name, p are popped from stack\n// \"Alice\" and Person(\"Bob\") become eligible for GC (if no other references)\n```\n\nString Pool (special Heap area):\n```java\nString a = \"hello\";           // from String Pool (interned)\nString b = \"hello\";           // same object from pool\nString c = new String(\"hello\"); // new object on Heap, outside pool\na == b    // true  \u2014 same pool object\na == c    // false \u2014 different objects\na.equals(c) // true \u2014 same content\n```"}, {"q": "How does Garbage Collection work? What are the GC phases?", "a": "Garbage Collection automatically reclaims memory occupied by objects that are no longer reachable from any GC root.\n\nGC Roots (always considered live):\n\u2022 Local variables and parameters on active threads' stacks.\n\u2022 Static variables.\n\u2022 JNI references.\n\u2022 Active thread objects.\n\nObject reachability:\n```\nGC Root \u2192 Object A \u2192 Object B \u2192 Object C  (all reachable \u2014 not collected)\nGC Root \u2192 Object D                         (reachable)\n          Object E \u2192 Object F              (unreachable \u2014 neither referenced from root \u2192 collected)\n```\n\nCore GC phases:\n\n1. Mark \u2014 traverse from GC roots, mark all reachable objects as live.\n   - Stop-The-World (STW): all app threads paused during initial mark.\n   - Concurrent mark: some GCs (G1, ZGC) continue marking concurrently.\n\n2. Sweep \u2014 identify and \"free\" memory occupied by unmarked (dead) objects.\n   - Does not actually zero memory \u2014 just marks regions as available.\n\n3. Compact (optional) \u2014 move live objects together to eliminate fragmentation.\n   - Allows fast bump-pointer allocation.\n   - Requires updating all references \u2014 expensive.\n\nGenerational GC (key optimization):\n\u2022 Most objects die young \u2014 allocating cheaply in Eden, collecting frequently.\n\u2022 Minor GC \u2014 collects Young Generation only (fast, frequent, STW ~ms).\n\u2022 Major/Full GC \u2014 collects Old Generation (slow, infrequent, STW ~seconds).\n\nObject promotion:\n```\nnew Object() \u2192 Eden\n    \u2193 (survives Minor GC)\nSurvivor S0/S1 (age++)\n    \u2193 (age reaches tenuring threshold, default 15)\nOld Generation\n    \u2193 (eventually collected by Major GC)\n```"}, {"q": "What are the different GC algorithms available in Java?", "a": "Java offers several GC implementations, each with different trade-off profiles.\n\nSerial GC (-XX:+UseSerialGC):\n\u2022 Single-threaded for all GC work. STW for every collection.\n\u2022 Smallest footprint. Good for tiny apps or single-core containers.\n\u2022 Not suitable for server applications.\n\nParallel GC (-XX:+UseParallelGC) \u2014 default before Java 9:\n\u2022 Multi-threaded Minor and Major GC. Still STW during collections.\n\u2022 Maximizes throughput \u2014 good for batch jobs and high-CPU workloads.\n\u2022 Long pause times during Full GC.\n\nG1 GC (-XX:+UseG1GC) \u2014 default since Java 9:\n\u2022 Divides heap into equal-sized regions (~2048 regions).\n\u2022 Collects regions with most garbage first (\"Garbage First\").\n\u2022 Concurrent marking with short STW pauses.\n\u2022 Predictable pause target: -XX:MaxGCPauseMillis=200 (soft goal).\n\u2022 Best general-purpose GC for most server applications.\n\nZGC (-XX:+UseZGC) \u2014 production-ready Java 15+:\n\u2022 Sub-millisecond pauses regardless of heap size (tested at multi-TB heaps).\n\u2022 Almost entirely concurrent \u2014 STW pauses < 1ms.\n\u2022 10-20% throughput overhead vs Parallel GC.\n\u2022 Ideal for latency-sensitive applications (trading, real-time APIs).\n\nShenandoah GC (-XX:+UseShenandoahGC) \u2014 Red Hat, Java 12+:\n\u2022 Similar goals to ZGC \u2014 low pause, concurrent compaction.\n\u2022 Compacts heap concurrently (ZGC does not compact concurrently until Java 21).\n\n```bash\n# G1 tuning (most common)\n-XX:+UseG1GC\n-XX:MaxGCPauseMillis=200       # pause target (soft)\n-XX:G1HeapRegionSize=16m       # region size (1MB to 32MB)\n-XX:G1NewSizePercent=20        # min young gen %\n-XX:G1MaxNewSizePercent=40     # max young gen %\n-XX:InitiatingHeapOccupancyPercent=45  # start concurrent mark at 45% heap\n```"}, {"q": "What is the difference between Minor GC, Major GC, and Full GC?", "a": "Minor GC:\n\u2022 Collects the Young Generation only (Eden + Survivor spaces).\n\u2022 Triggered when Eden is full.\n\u2022 Very frequent \u2014 may run hundreds of times per minute.\n\u2022 Short STW pause (milliseconds) \u2014 only scans a small region.\n\u2022 Surviving objects promoted to Survivor or Old Generation.\n\nMajor GC (Old Generation GC):\n\u2022 Collects the Old Generation.\n\u2022 Triggered when Old Gen is full or fragmented.\n\u2022 Much slower \u2014 Old Gen is larger and live objects are more numerous.\n\u2022 Often preceded by a Minor GC.\n\nFull GC:\n\u2022 Collects entire heap \u2014 Young + Old + Metaspace.\n\u2022 Most disruptive \u2014 long STW pause (can be seconds).\n\u2022 Triggers:\n  - System.gc() call (or -XX:+DisableExplicitGC to prevent).\n  - Metaspace fills up.\n  - Promotion failure \u2014 Old Gen can't fit promoted objects.\n  - CMS/G1 concurrent mode failure \u2014 GC can't keep up with allocation.\n\nMonitoring GC with JVM flags:\n```bash\n-Xlog:gc*:file=gc.log:time,uptime:filecount=5,filesize=20m\n# OR (older format)\n-verbose:gc\n-XX:+PrintGCDetails\n-XX:+PrintGCDateStamps\n```\n\nGC log output to watch for:\n```\n[GC (Allocation Failure) 0.112s]   \u2190 Minor GC \u2014 normal\n[Full GC (Ergonomics) 2.341s]      \u2190 Full GC \u2014 investigate if frequent!\n[GC (System.gc()) 5.102s]          \u2190 Explicit GC \u2014 should be disabled in prod\n```\n\n\ud83d\udccc Frequent Full GCs are a red flag \u2014 usually means heap is too small, too many long-lived objects, or a memory leak."}, {"q": "What are common memory leaks in Java and how do you detect them?", "a": "Java memory leaks occur when objects are no longer needed but remain reachable from GC roots \u2014 preventing garbage collection.\n\nCommon causes:\n\n1. Static collections that grow indefinitely:\n```java\n// LEAK \u2014 static map grows forever, entries never removed\npublic class Cache {\n    private static final Map<String, byte[]> cache = new HashMap<>();\n    public static void put(String key, byte[] data) {\n        cache.put(key, data); // never evicted!\n    }\n}\n// Fix: use WeakHashMap, or a bounded cache (Caffeine, Guava)\n```\n\n2. Listeners and callbacks not deregistered:\n```java\n// LEAK \u2014 if listener holds reference to large object and is never removed\neventBus.addListener(myHeavyListener);\n// Fix: always call eventBus.removeListener(myHeavyListener) when done\n```\n\n3. Inner classes holding outer class references:\n```java\n// LEAK \u2014 anonymous Runnable holds implicit reference to OuterClass instance\npublic class OuterClass {\n    public void startTask() {\n        new Thread(new Runnable() {        // holds reference to OuterClass!\n            public void run() { doWork(); }\n        }).start();\n    }\n}\n// Fix: use static inner class or extract to separate class\n```\n\n4. ThreadLocal not cleaned up:\n```java\nThreadLocal<byte[]> tl = new ThreadLocal<>();\ntl.set(new byte[1024 * 1024]);\n// Fix: always call tl.remove() in finally block when using thread pools\n```\n\n5. Unclosed resources (less common with try-with-resources):\n```java\n// LEAK \u2014 connection never closed on exception\nConnection conn = ds.getConnection();\nconn.prepareStatement(sql).execute();\n// Fix: use try-with-resources\ntry (Connection conn = ds.getConnection();\n     PreparedStatement ps = conn.prepareStatement(sql)) {\n    ps.execute();\n}\n```\n\nDetection tools:\n```bash\n# Heap dump\njmap -dump:format=b,file=heap.hprof <pid>\n# or add JVM flag: -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heap.hprof\n\n# Analyze with: Eclipse MAT, VisualVM, JProfiler, YourKit\n# Look for: \"Leak Suspects\", objects with unexpectedly high retained heap\n```"}, {"q": "What are Strong, Weak, Soft, and Phantom references in Java?", "a": "Java provides four reference types (in java.lang.ref) that give you control over GC eligibility.\n\nStrong Reference (default):\n```java\nObject obj = new Object(); // strong reference\n// obj is NOT eligible for GC as long as this reference exists\nobj = null; // now eligible for GC\n```\n\nSoft Reference \u2014 collected only when JVM needs memory (OOM imminent):\n```java\nSoftReference<byte[]> softRef = new SoftReference<>(new byte[1024 * 1024]);\nbyte[] data = softRef.get(); // null if GC collected it\nif (data == null) data = loadFromDisk(); // reload on cache miss\n// Use case: memory-sensitive caches \u2014 JVM evicts when heap pressure is high\n```\n\nWeak Reference \u2014 collected at next GC regardless of memory:\n```java\nWeakReference<Widget> weakRef = new WeakReference<>(widget);\nWidget w = weakRef.get(); // null after next GC if no strong refs exist\nif (w != null) w.render();\n// Use case: WeakHashMap \u2014 entries auto-removed when keys are no longer strongly referenced\nWeakHashMap<Key, Value> map = new WeakHashMap<>();\n```\n\nPhantom Reference \u2014 object already finalized, use for cleanup:\n```java\nReferenceQueue<Object> queue = new ReferenceQueue<>();\nPhantomReference<Object> phantom = new PhantomReference<>(obj, queue);\n// phantom.get() always returns null\n// Object is enqueued AFTER finalization \u2014 use for precise cleanup\n// Use case: replacing/supplementing finalize() for resource cleanup\n```\n\nReference strength (GC collection order):\n```\nPhantom \u2192 Weak \u2192 Soft \u2192 Strong\n(most eagerly collected \u2192 least)\n```\n\nPractical example \u2014 Caffeine cache internals use weak/soft references:\n```java\n// Caffeine cache with weak keys and soft values\nCache<Key, Value> cache = Caffeine.newBuilder()\n    .weakKeys()           // entries removed when key is GC'd\n    .softValues()         // values cleared under memory pressure\n    .build();\n```"}, {"q": "What is object finalization and what replaced it in modern Java?", "a": "Finalization is a mechanism where the GC calls an object's finalize() method before reclaiming it \u2014 giving the object a chance to release resources.\n\nProblems with finalize():\n\u2022 Unpredictable timing \u2014 no guarantee when or if it runs.\n\u2022 Can resurrect objects (making them reachable again) \u2014 causes a second GC cycle.\n\u2022 Performance \u2014 finalizable objects require two GC cycles to collect.\n\u2022 JVM may exit without calling finalize() \u2014 resources leak.\n\u2022 Deprecated since Java 9, marked for removal.\n\n```java\n// AVOID \u2014 finalize() is unreliable\n@Override\nprotected void finalize() throws Throwable {\n    try {\n        close(); // unreliable cleanup!\n    } finally {\n        super.finalize();\n    }\n}\n```\n\nModern replacement 1 \u2014 Implement AutoCloseable + try-with-resources:\n```java\npublic class DatabaseConnection implements AutoCloseable {\n    private final Connection conn;\n\n    public DatabaseConnection(String url) throws SQLException {\n        this.conn = DriverManager.getConnection(url);\n    }\n\n    @Override\n    public void close() throws SQLException {\n        conn.close(); // deterministic, immediate cleanup\n    }\n}\n\ntry (DatabaseConnection db = new DatabaseConnection(url)) {\n    db.query(\"SELECT ...\");\n} // close() called automatically \u2014 even if exception thrown\n```\n\nModern replacement 2 \u2014 Cleaner API (Java 9+):\n```java\npublic class NativeResource {\n    private final Cleaner.Cleanable cleanable;\n\n    public NativeResource() {\n        Cleaner cleaner = Cleaner.create();\n        this.cleanable = cleaner.register(this, new CleanupAction());\n    }\n\n    private static class CleanupAction implements Runnable {\n        public void run() { freeNativeMemory(); } // called by GC thread\n    }\n\n    public void close() { cleanable.clean(); } // explicit cleanup\n}\n```\n\n\ud83d\udccc Always prefer AutoCloseable + try-with-resources for deterministic resource cleanup. Use Cleaner only for off-heap/native resources where explicit close() isn't always possible."}, {"q": "How do you tune JVM GC for a Spring Boot microservice?", "a": "GC tuning depends on your application's workload: latency-sensitive vs throughput-optimized.\n\nStep 1 \u2014 Enable GC logging (always do this in production):\n```bash\n# Java 9+ unified logging\n-Xlog:gc*:file=/var/log/app/gc.log:time,uptime,pid:filecount=10,filesize=20m\n```\n\nStep 2 \u2014 Choose the right GC:\n```bash\n# General-purpose server app (default since Java 9)\n-XX:+UseG1GC -XX:MaxGCPauseMillis=200\n\n# Latency-critical (trading, real-time APIs) \u2014 Java 15+\n-XX:+UseZGC\n\n# Batch / high throughput \u2014 maximize CPU for work not GC\n-XX:+UseParallelGC\n```\n\nStep 3 \u2014 Set heap appropriately:\n```bash\n# Rule of thumb: set Xms = Xmx to avoid resizing pauses\n-Xms1g -Xmx1g        # small microservice\n-Xms2g -Xmx2g        # medium service\n# Leave 25-30% of container RAM for off-heap (Metaspace, threads, buffers)\n# Container with 4GB RAM \u2192 -Xmx3g\n```\n\nStep 4 \u2014 Container-aware settings (Java 10+):\n```bash\n# Let JVM read cgroup limits (Docker/K8s) \u2014 enabled by default Java 10+\n-XX:+UseContainerSupport\n-XX:MaxRAMPercentage=75.0   # use 75% of container RAM for heap\n```\n\nSpring Boot production JVM flags example:\n```bash\njava   -XX:+UseG1GC   -XX:MaxGCPauseMillis=200   -XX:+UseContainerSupport   -XX:MaxRAMPercentage=75.0   -XX:+HeapDumpOnOutOfMemoryError   -XX:HeapDumpPath=/var/log/app/heap.hprof   -Xlog:gc*:file=/var/log/app/gc.log:time,uptime:filecount=5,filesize=20m   -jar app.jar\n```\n\nKey GC metrics to monitor (Prometheus + Grafana):\n```\njvm_gc_pause_seconds_sum         \u2014 total GC pause time\njvm_gc_pause_seconds_max         \u2014 worst pause (P99)\njvm_memory_used_bytes            \u2014 heap used\njvm_memory_max_bytes             \u2014 heap max\nprocess_cpu_usage                \u2014 CPU \u2014 high GC = high CPU\n```\n\n\ud83d\udccc Don't over-tune prematurely. Enable GC logging first, measure, then tune. Most apps run fine with just -XX:+UseG1GC and proper heap sizing."}, {"q": "What is Metaspace and how does it differ from PermGen?", "a": "Before Java 8, the JVM had a Permanent Generation (PermGen) \u2014 a fixed-size heap region storing class metadata, interned strings, and static variables.\n\nPermGen problems:\n\u2022 Fixed size \u2014 configured with -XX:MaxPermSize (default ~64\u2013256MB).\n\u2022 java.lang.OutOfMemoryError: PermGen space \u2014 common in apps with heavy use of reflection, CGLIB proxies, or many classloaders (app servers, OSGi).\n\u2022 Hard to tune \u2014 too small caused OOM, too large wasted memory.\n\u2022 Interned strings stored here \u2014 large string pools caused PermGen exhaustion.\n\nJava 8 \u2014 Metaspace replaces PermGen:\n\u2022 Stored in NATIVE memory (off-heap) \u2014 not limited by -Xmx.\n\u2022 Grows dynamically by default \u2014 no fixed cap.\n\u2022 Interned strings moved to main heap.\n\u2022 Static variables moved to main heap.\n\n```bash\n# PermGen (Java 7 and earlier \u2014 do not use in Java 8+)\n-XX:PermSize=128m\n-XX:MaxPermSize=256m     # obsolete \u2014 ignored in Java 8+\n\n# Metaspace (Java 8+)\n-XX:MetaspaceSize=128m       # initial size before first GC of Metaspace\n-XX:MaxMetaspaceSize=512m    # ALWAYS set this! Default = unlimited (native OOM risk)\n```\n\nWhen does Metaspace grow?\n\u2022 Each time a class is loaded, its metadata is stored in Metaspace.\n\u2022 ClassLoaders that aren't GC'd keep their classes loaded.\n\u2022 Frameworks that generate classes (Spring CGLIB, Hibernate proxies, Groovy scripts, JSPs) can cause Metaspace growth.\n\nMetaspace OOM symptoms:\n```\njava.lang.OutOfMemoryError: Metaspace\n  \u2192 Too many classes loaded \u2014 check for classloader leaks\n  \u2192 Framework generating too many dynamic proxies\n  \u2192 Set -XX:MaxMetaspaceSize and monitor jvm_memory_used_bytes{area=\"nonheap\"}\n```"}, {"q": "What is the G1 GC and how does it work internally?", "a": "G1 (Garbage First) is the default GC since Java 9. It divides the heap into equal-sized regions and prioritizes collecting regions with the most garbage.\n\nHeap layout:\n```\nG1 Heap = array of equal-sized regions (1MB to 32MB each)\nEach region is dynamically assigned a role:\n  E  = Eden region\n  S  = Survivor region\n  O  = Old region\n  H  = Humongous region (objects > 50% of region size)\n  F  = Free / available\n```\n\nG1 GC cycle:\n\nPhase 1 \u2014 Minor (Young-only) GC:\n\u2022 Runs frequently. Collects Eden + Survivor regions.\n\u2022 Short STW pause. Survivors promoted to new Survivor or Old regions.\n\nPhase 2 \u2014 Concurrent Marking (when heap reaches IHOP threshold, default 45%):\n\u2022 Initial Mark: STW, very short \u2014 piggybacks on Minor GC.\n\u2022 Concurrent Mark: runs alongside app threads \u2014 marks live objects.\n\u2022 Remark: STW, short \u2014 finalizes marking.\n\u2022 Cleanup: STW + concurrent \u2014 reclaims empty regions, sorts by garbage %.\n\nPhase 3 \u2014 Mixed GC:\n\u2022 Collects all Young regions + selected Old regions (those with most garbage).\n\u2022 Repeats until Old Gen is cleaned up enough.\n\u2022 Target: collect regions to stay below MaxGCPauseMillis.\n\nHumongous objects (> region_size / 2):\n\u2022 Allocated directly in Old Generation.\n\u2022 Can cause premature GC if they fill Old Gen quickly.\n\u2022 Fix: increase -XX:G1HeapRegionSize or avoid large object allocations.\n\nKey tuning knobs:\n```bash\n-XX:MaxGCPauseMillis=200          # pause target (soft \u2014 G1 tries its best)\n-XX:G1HeapRegionSize=16m          # region size (power of 2, 1\u201332MB)\n-XX:InitiatingHeapOccupancyPercent=45  # start concurrent mark at 45% heap full\n-XX:G1MixedGCCountTarget=8        # num of mixed GCs to drain Old Gen\n-XX:G1HeapWastePercent=5          # stop mixed GC when Old Gen < 5% garbage\n```"}, {"q": "How do you diagnose and resolve OutOfMemoryError in Java?", "a": "OutOfMemoryError has several subtypes \u2014 each points to a different root cause.\n\nOOM subtypes:\n\n1. java.lang.OutOfMemoryError: Java heap space\n   Cause: Heap too small, memory leak, or too many live objects.\n```bash\n# Immediate fix: increase heap\n-Xmx4g\n\n# Get heap dump for analysis\n-XX:+HeapDumpOnOutOfMemoryError\n-XX:HeapDumpPath=/tmp/heap.hprof\n```\n\n2. java.lang.OutOfMemoryError: Metaspace\n   Cause: Too many classes loaded, classloader leak.\n```bash\n-XX:MaxMetaspaceSize=512m\n# Investigate: jmap -clstats <pid> \u2014 shows classloader stats\n```\n\n3. java.lang.OutOfMemoryError: GC overhead limit exceeded\n   Cause: JVM spending > 98% of time in GC, recovering < 2% heap \u2014 usually a leak.\n```bash\n-XX:-UseGCOverheadLimit   # disables the check (not recommended \u2014 just delays OOM)\n# Real fix: find and fix the memory leak\n```\n\n4. java.lang.OutOfMemoryError: Direct buffer memory\n   Cause: NIO direct buffers (-XX:MaxDirectMemorySize exceeded).\n```bash\n-XX:MaxDirectMemorySize=512m\n```\n\n5. java.lang.OutOfMemoryError: unable to create native thread\n   Cause: Too many threads \u2014 OS limit reached.\n```bash\n# Reduce thread count or increase OS limits\nulimit -u 65536   # max processes/threads for user\n```\n\nHeap dump analysis workflow:\n```bash\n# 1. Get heap dump (auto on OOM or manually)\njmap -dump:live,format=b,file=heap.hprof <pid>\n\n# 2. Analyze with Eclipse MAT (free)\n# Open heap.hprof \u2192 Run \"Leak Suspects\" report\n# Look for: objects with high \"Retained Heap\" %\n\n# 3. Common findings:\n# - Large HashMap/ArrayList with unexpected size\n# - Many duplicate String objects\n# - Hibernate session cache not cleared\n# - Thread-local variables not removed\n```\n\nHeap usage monitoring query (PromQL for Grafana):\n```\n# Heap utilization %\njvm_memory_used_bytes{area=\"heap\"} / jvm_memory_max_bytes{area=\"heap\"} * 100\n# Alert if > 85% sustained\n```"}, {"q": "What is escape analysis and how does the JVM optimize object allocation?", "a": "Escape Analysis is a JIT compiler optimization that determines whether an object's lifetime is limited to a method or thread \u2014 enabling stack allocation and other optimizations.\n\nAn object \"escapes\" if it:\n\u2022 Is returned from a method.\n\u2022 Is passed to another method that stores it.\n\u2022 Is stored in a static field or heap field.\n\u2022 Is accessed by multiple threads.\n\nIf an object does NOT escape \u2014 JIT can optimize:\n\n1. Stack Allocation \u2014 allocate on the stack instead of heap (no GC pressure!):\n```java\npublic int sumPoint() {\n    Point p = new Point(3, 4); // p doesn't escape \u2014 may be stack-allocated\n    return p.x + p.y;          // p never returned, stored, or shared\n}\n// JIT may allocate p on the stack \u2192 no heap allocation \u2192 no GC involvement\n```\n\n2. Scalar Replacement \u2014 decompose object into its fields (no object at all!):\n```java\n// Instead of allocating Point object, JIT may just use two int registers:\nint px = 3; int py = 4;\nreturn px + py;\n```\n\n3. Lock Elision \u2014 remove synchronized blocks if object doesn't escape:\n```java\npublic String build() {\n    StringBuffer sb = new StringBuffer(); // sb doesn't escape\n    sb.append(\"hello\");  // synchronized internally\n    return sb.toString();\n    // JIT elides all synchronization \u2014 StringBuffer.append locks are removed\n}\n```\n\nEnabling/verifying (diagnostic flags):\n```bash\n-XX:+DoEscapeAnalysis          # enabled by default since Java 6\n-XX:+EliminateAllocations      # scalar replacement \u2014 default on\n-XX:+PrintEliminateAllocations # diagnostic \u2014 shows what was optimized\n```\n\nProject Valhalla (future Java) \u2014 Value Types:\n\u2022 Explicit stack-friendly value objects.\n\u2022 record Point(int x, int y) {} may become a value type with no heap allocation.\n\u2022 Currently in preview \u2014 will formalize what escape analysis does implicitly.\n\n\ud83d\udccc Escape analysis is automatic \u2014 you don't configure it. Write clean, short-lived local objects and the JIT will optimize them. The takeaway: small, method-scoped objects are often \"free\" in modern JVMs."}, {"q": "What tools do you use to monitor and profile JVM memory?", "a": "Several tools exist for different levels of memory monitoring \u2014 from production dashboards to deep profiling.\n\nBuilt-in JDK tools:\n\njps \u2014 list running JVM processes:\n```bash\njps -lv   # shows PID, main class, and JVM args\n```\n\njmap \u2014 heap and classloader info:\n```bash\njmap -heap <pid>           # heap summary (sizes, GC algo, usage)\njmap -histo <pid>          # object histogram \u2014 top classes by instance count\njmap -clstats <pid>        # classloader statistics\njmap -dump:live,format=b,file=heap.hprof <pid>  # heap dump\n```\n\njstat \u2014 GC statistics in real-time:\n```bash\njstat -gcutil <pid> 1000 20   # print GC stats every 1s, 20 times\n# Output: S0  S1   E    O    M    YGC  YGCT  FGC FGCT  GCT\n#          0  85%  62%  41%  95%  134  2.8s   2  1.1s  3.9s\n```\n\njcmd \u2014 Swiss Army knife for JVM diagnostics:\n```bash\njcmd <pid> VM.flags          # print all JVM flags\njcmd <pid> GC.heap_info      # heap layout\njcmd <pid> GC.run            # trigger GC\njcmd <pid> Thread.print      # thread dump\njcmd <pid> VM.native_memory  # native memory breakdown (needs -XX:NativeMemoryTracking=summary)\n```\n\nJVM flags for production monitoring:\n```bash\n-XX:+PrintGCDetails\n-Xlog:gc*:file=gc.log:time,uptime:filecount=5,filesize=20m\n-XX:+HeapDumpOnOutOfMemoryError\n-XX:HeapDumpPath=/dumps/heap.hprof\n-XX:NativeMemoryTracking=summary\n```\n\nSpring Boot Actuator + Micrometer + Prometheus:\n```yaml\nmanagement.endpoints.web.exposure.include: prometheus,health,metrics\nmanagement.metrics.export.prometheus.enabled: true\n```\n```\n# Key Grafana JVM dashboard metrics:\njvm_memory_used_bytes        \u2014 heap/non-heap usage\njvm_gc_pause_seconds_*       \u2014 GC pause duration\njvm_gc_memory_promoted_bytes \u2014 objects promoted to Old Gen\njvm_threads_live_threads     \u2014 active threads\njvm_buffer_memory_used_bytes \u2014 direct buffer usage\n```\n\nGUI tools:\n\u2022 VisualVM (free, bundled with JDK) \u2014 heap, threads, profiler, heap dump analysis.\n\u2022 Eclipse MAT \u2014 best for heap dump analysis and leak suspects.\n\u2022 JProfiler / YourKit \u2014 commercial, most detailed CPU + memory profiling.\n\u2022 IntelliJ IDEA Profiler \u2014 built-in async profiler integration."}], "advanced": [{"q": "What is the difference between Comparable and Comparator?", "a": "\u2022 Comparable: Interface in java.lang. Defines natural ordering. Implement compareTo(T o) inside the class.\n\n```java\nclass Employee implements Comparable<Employee> {\n    public int compareTo(Employee e) { return this.id - e.id; }\n}\n```\n\n\u2022 Comparator: Interface in java.util. External/custom ordering. Implement compare(T o1, T o2) separately.\n\n```java\nComparator<Employee> byName = Comparator.comparing(Employee::getName);\nlist.sort(byName);\n```\n\n\ud83d\udccc Use Comparable for default sort; Comparator for flexible, multiple sort strategies."}, {"q": "What is Optional in Java and why use it?", "a": "Optional<T> (Java 8+) is a container that may or may not hold a value. It prevents NullPointerException.\n\n```java\nOptional<String> name = Optional.ofNullable(getName());\nname.ifPresent(n -> System.out.println(n));\nString result = name.orElse(\"Unknown\");\nString mapped = name.map(String::toUpperCase).orElseGet(() -> \"NONE\");\n```\n\n\ud83d\udccc Best practices:\n\u2022 Don't use Optional as method parameters or fields.\n\u2022 Use it as a return type when a value might be absent.\n\u2022 Avoid optional.get() without isPresent() \u2014 use orElse / orElseThrow."}, {"q": "Explain Java Concurrency: Thread, ExecutorService, and CompletableFuture.", "a": "\u2022 Thread: Low-level. Create by extending Thread or implementing Runnable.\n\n\u2022 ExecutorService: Thread pool management. Preferred over raw threads.\n```java\nExecutorService pool = Executors.newFixedThreadPool(4);\npool.submit(() -> doWork());\npool.shutdown();\n```\n\n\u2022 CompletableFuture (Java 8+): Async, non-blocking computation with chaining.\n```java\nCompletableFuture.supplyAsync(() -> fetchData())\n    .thenApply(data -> process(data))\n    .thenAccept(result -> save(result))\n    .exceptionally(ex -> { log(ex); return null; });\n```"}, {"q": "What is Java Reflection and when would you use it?", "a": "Reflection allows inspection and manipulation of classes, methods, and fields at runtime.\n\n```java\nClass<?> clazz = Class.forName(\"com.example.MyClass\");\nMethod method = clazz.getMethod(\"myMethod\", String.class);\nObject instance = clazz.getDeclaredConstructor().newInstance();\nmethod.invoke(instance, \"arg\");\n```\n\nUse cases:\n\u2022 Frameworks (Spring, Hibernate) use reflection to inject dependencies and map entities.\n\u2022 Unit testing tools (JUnit, Mockito) use it to access private members.\n\u2022 Serialization/deserialization libraries.\n\n\ud83d\udccc Use sparingly \u2014 reflection bypasses compile-time checks, is slower, and can break encapsulation."}], "patterns": [{"q": "What is the Singleton Pattern? How do you implement it thread-safely?", "a": "Singleton ensures only one instance of a class exists.\n\nThread-safe (Bill Pugh \u2014 best practice):\n```java\npublic class Singleton {\n    private Singleton() {}\n    private static class Holder {\n        private static final Singleton INSTANCE = new Singleton();\n    }\n    public static Singleton getInstance() {\n        return Holder.INSTANCE;\n    }\n}\n```\n\nOther approaches:\n\u2022 Enum Singleton (Joshua Bloch recommended): Serialization-safe + reflection-proof.\n\u2022 Double-checked locking with the volatile keyword."}, {"q": "Explain the Factory and Abstract Factory patterns.", "a": "Factory Method: Defines an interface for creating objects, but lets subclasses decide which class to instantiate.\n\n```java\ninterface Animal { void speak(); }\nclass Dog implements Animal { public void speak() { System.out.println(\"Woof\"); } }\n\nclass AnimalFactory {\n    public static Animal create(String type) {\n        return switch(type) {\n            case \"dog\" -> new Dog();\n            default -> throw new IllegalArgumentException();\n        };\n    }\n}\n```\n\nAbstract Factory: Creates families of related objects without specifying concrete classes. It provides a factory of factories.\n\n\ud83d\udccc Factory = one product. Abstract Factory = product families."}, {"q": "What is the Builder Pattern and when should you use it?", "a": "Builder separates the construction of complex objects from their representation.\n\n```java\nUser user = new User.Builder(\"John\", \"john@email.com\")\n    .age(30)\n    .phone(\"123-456\")\n    .address(\"NYC\")\n    .build();\n```\n\nUse when:\n\u2022 Constructor has many parameters (telescoping constructor problem).\n\u2022 Object needs to be immutable after construction.\n\u2022 Some parameters are optional.\n\n\ud83d\udccc Lombok's @Builder auto-generates builder code. Java Records partially replace builders for simple cases."}, {"q": "Explain the Observer Pattern.", "a": "Observer (Pub-Sub) defines a one-to-many dependency: when one object changes state, all dependents are notified.\n\n```java\ninterface Observer { void update(String event); }\n\nclass EventBus {\n    private List<Observer> observers = new ArrayList<>();\n    public void subscribe(Observer o) { observers.add(o); }\n    public void publish(String event) {\n        observers.forEach(o -> o.update(event));\n    }\n}\n```\n\nReal-world usage:\n\u2022 Java's EventListener / EventObject\n\u2022 Spring's ApplicationEvent / @EventListener\n\u2022 RxJava / Project Reactor (reactive streams)"}, {"q": "What is the Strategy Pattern?", "a": "Strategy defines a family of algorithms, encapsulates each one, and makes them interchangeable.\n\n```java\ninterface SortStrategy { void sort(int[] data); }\nclass BubbleSort implements SortStrategy { ... }\nclass QuickSort  implements SortStrategy { ... }\n\nclass Sorter {\n    private SortStrategy strategy;\n    public Sorter(SortStrategy strategy) { this.strategy = strategy; }\n    public void sort(int[] data) { strategy.sort(data); }\n}\n```\n\n\ud83d\udccc With Java 8+ lambdas, strategies can be passed as Function or custom functional interfaces \u2014 no need for extra classes."}, {"q": "What is the Decorator Pattern?", "a": "Decorator adds behavior to objects dynamically without modifying their class.\n\n```java\ninterface Coffee { double getCost(); }\nclass SimpleCoffee implements Coffee { public double getCost() { return 1.0; } }\n\nclass MilkDecorator implements Coffee {\n    private Coffee coffee;\n    public MilkDecorator(Coffee c) { this.coffee = c; }\n    public double getCost() { return coffee.getCost() + 0.5; }\n}\n// Usage\nCoffee c = new MilkDecorator(new SimpleCoffee()); // $1.50\n```\n\n\ud83d\udccc Java I/O streams are built using the Decorator pattern (BufferedReader wraps FileReader)."}, {"q": "What is the Proxy Pattern?", "a": "Proxy provides a surrogate/placeholder for another object to control access to it.\n\nTypes:\n\u2022 Virtual Proxy: Lazy initialization (create expensive objects on demand).\n\u2022 Protection Proxy: Access control.\n\u2022 Remote Proxy: Represents object in another JVM/network.\n\u2022 Caching Proxy: Cache results.\n\n```java\ninterface Service { String fetch(); }\nclass RealService implements Service { public String fetch() { return \"data\"; } }\nclass CachingProxy implements Service {\n    private RealService real = new RealService();\n    private String cache;\n    public String fetch() {\n        if (cache == null) cache = real.fetch();\n        return cache;\n    }\n}\n```\n\n\ud83d\udccc Spring AOP uses dynamic proxies (JDK Proxy / CGLIB) extensively."}], "spring": [{"q": "What is the Spring Framework and what problems does it solve?", "a": "Spring is a comprehensive, lightweight Java application framework built around two core principles: Inversion of Control (IoC) and Aspect-Oriented Programming (AOP).\n\nProblems Spring solves:\n\u2022 Tight coupling \u2014 Spring's IoC container manages object creation and wiring, decoupling components.\n\u2022 Boilerplate code \u2014 Spring eliminates repetitive infrastructure code (JDBC, transactions, JMS).\n\u2022 Testability \u2014 DI makes it easy to inject mocks and write unit tests.\n\u2022 Cross-cutting concerns \u2014 AOP handles logging, security, and transactions without cluttering business logic.\n\u2022 Enterprise integration \u2014 Spring provides modules for web, data, messaging, security, cloud, and more.\n\nSpring Module ecosystem:\n```\nCore          \u2014 IoC container, DI, SpEL, events\nAOP           \u2014 Aspect-Oriented Programming, proxies\nData Access   \u2014 JDBC, ORM (Hibernate/JPA), transactions\nWeb           \u2014 Spring MVC, Spring WebFlux (reactive)\nSecurity      \u2014 Authentication, Authorization, OAuth2\nMessaging     \u2014 JMS, Kafka, RabbitMQ integration\nTest          \u2014 TestContext framework, MockMvc\n```\n\n\ud83d\udccc Spring Boot builds on top of Spring Framework with auto-configuration, embedded servers, and opinionated defaults."}, {"q": "What is Inversion of Control (IoC) and the IoC Container?", "a": "Inversion of Control (IoC) is a design principle where the control of object creation and lifecycle is transferred from the application code to an external container/framework.\n\nWithout IoC (tight coupling):\n```java\npublic class OrderService {\n    private PaymentService paymentService = new PaymentService(); // you create it\n}\n```\n\nWith IoC (loose coupling):\n```java\npublic class OrderService {\n    private PaymentService paymentService; // container provides it\n\n    public OrderService(PaymentService paymentService) {\n        this.paymentService = paymentService;\n    }\n}\n```\n\nThe IoC Container:\n\u2022 Reads configuration (annotations, XML, Java config).\n\u2022 Creates and manages bean instances and their lifecycle.\n\u2022 Injects dependencies where needed.\n\nTwo main container types:\n\u2022 BeanFactory \u2014 lightweight, basic DI container. Lazy initialization.\n\u2022 ApplicationContext \u2014 extends BeanFactory. Adds: event publishing, internationalization, AOP integration, eager initialization.\n  - ClassPathXmlApplicationContext\n  - AnnotationConfigApplicationContext\n  - WebApplicationContext (for Spring MVC)"}, {"q": "What is Dependency Injection? Explain all three types with examples.", "a": "Dependency Injection (DI) is the mechanism Spring uses to implement IoC \u2014 it injects required dependencies into objects rather than having objects create their own.\n\n1. Constructor Injection (recommended):\n```java\n@Service\npublic class OrderService {\n    private final PaymentService paymentService;\n    private final InventoryService inventoryService;\n\n    // Spring injects both \u2014 immutable, testable, explicit\n    public OrderService(PaymentService p, InventoryService i) {\n        this.paymentService = p;\n        this.inventoryService = i;\n    }\n}\n```\n\n2. Setter Injection (for optional dependencies):\n```java\n@Service\npublic class NotificationService {\n    private EmailService emailService;\n\n    @Autowired\n    public void setEmailService(EmailService emailService) {\n        this.emailService = emailService;\n    }\n}\n```\n\n3. Field Injection (convenient but not recommended):\n```java\n@Service\npublic class ProductService {\n    @Autowired\n    private ProductRepository repository; // hard to test, hidden dependency\n}\n```\n\nWhy constructor injection is preferred:\n\u2022 Makes dependencies explicit and mandatory.\n\u2022 Enables final fields (immutability).\n\u2022 Easier to unit test (just pass mocks to constructor).\n\u2022 Detects circular dependencies at startup, not at runtime."}, {"q": "What is a Spring Bean? Explain Bean scopes.", "a": "A Spring Bean is any object managed by the Spring IoC container. Beans are created, wired, and destroyed by the container.\n\nDeclaring a bean:\n```java\n@Component        // generic bean\n@Service          // service layer\n@Repository       // data access layer\n@Controller       // web layer\n@Bean             // explicit factory method in @Configuration class\n```\n\nBean Scopes:\n\nScope         | Description\n--------------|---------------------------------------------\nsingleton     | One instance per ApplicationContext (DEFAULT)\nprototype     | New instance every time bean is requested\nrequest       | One instance per HTTP request (web only)\nsession       | One instance per HTTP session (web only)\napplication   | One instance per ServletContext (web only)\nwebsocket     | One instance per WebSocket session\n\n```java\n@Component\n@Scope(\"prototype\")\npublic class ShoppingCart { ... }\n\n@Component\n@Scope(value = WebApplicationContext.SCOPE_REQUEST, proxyMode = ScopedProxyMode.TARGET_CLASS)\npublic class RequestContext { ... }\n```\n\n\ud83d\udccc Singleton beans are shared \u2014 make them stateless. Use prototype for stateful beans. Use request/session for web-scoped state."}, {"q": "What is the Bean Lifecycle in Spring?", "a": "Spring manages the full lifecycle of beans from instantiation to destruction.\n\nFull lifecycle order:\n```\n1. Instantiation      \u2014 constructor called\n2. Populate props     \u2014 dependencies injected (@Autowired, setters)\n3. BeanNameAware      \u2014 setBeanName() called (if implemented)\n4. BeanFactoryAware   \u2014 setBeanFactory() called (if implemented)\n5. ApplicationContextAware \u2014 setApplicationContext() called\n6. BeanPostProcessor  \u2014 postProcessBeforeInitialization()\n7. @PostConstruct     \u2014 initialization callback\n8. InitializingBean   \u2014 afterPropertiesSet() (if implemented)\n9. @Bean(initMethod)  \u2014 custom init method\n10. BeanPostProcessor \u2014 postProcessAfterInitialization()\n--- Bean is ready and in use ---\n11. @PreDestroy       \u2014 destruction callback\n12. DisposableBean    \u2014 destroy() (if implemented)\n13. @Bean(destroyMethod) \u2014 custom destroy method\n```\n\n```java\n@Component\npublic class DatabasePool {\n\n    @PostConstruct\n    public void init() {\n        System.out.println(\"Initializing connection pool...\");\n    }\n\n    @PreDestroy\n    public void cleanup() {\n        System.out.println(\"Closing all connections...\");\n    }\n}\n```\n\n\ud83d\udccc Prefer @PostConstruct and @PreDestroy over implementing InitializingBean/DisposableBean \u2014 they're annotation-based and don't couple your class to Spring interfaces."}, {"q": "What is Spring AOP? Explain core concepts with examples.", "a": "AOP (Aspect-Oriented Programming) separates cross-cutting concerns (logging, security, transactions) from business logic using proxies.\n\nCore terminology:\n\u2022 Aspect     \u2014 the cross-cutting concern encapsulated in a class (@Aspect).\n\u2022 Join Point \u2014 a point in execution where advice can be applied (always a method execution in Spring AOP).\n\u2022 Advice     \u2014 the action taken at a join point (what to do).\n\u2022 Pointcut   \u2014 expression that selects join points (where to apply advice).\n\u2022 Weaving    \u2014 applying aspects to target objects (Spring does runtime weaving via proxies).\n\nAdvice types:\n```java\n@Aspect\n@Component\npublic class AuditAspect {\n\n    @Before(\"execution(* com.example.service.*.*(..))\")\n    public void logBefore(JoinPoint jp) {\n        System.out.println(\"Calling: \" + jp.getSignature().getName());\n    }\n\n    @AfterReturning(pointcut = \"execution(* com.example.service.*.*(..))\", returning = \"result\")\n    public void logAfter(Object result) {\n        System.out.println(\"Returned: \" + result);\n    }\n\n    @AfterThrowing(pointcut = \"execution(* com.example.service.*.*(..))\", throwing = \"ex\")\n    public void logException(Exception ex) {\n        System.out.println(\"Exception: \" + ex.getMessage());\n    }\n\n    @Around(\"@annotation(com.example.annotation.Timed)\")\n    public Object measureTime(ProceedingJoinPoint pjp) throws Throwable {\n        long start = System.currentTimeMillis();\n        Object result = pjp.proceed();\n        System.out.println(\"Elapsed: \" + (System.currentTimeMillis() - start) + \"ms\");\n        return result;\n    }\n}\n```"}, {"q": "What are Spring Pointcut expressions? How do you write them?", "a": "Pointcut expressions define WHERE advice applies. Spring AOP uses AspectJ pointcut expression language.\n\nexecution() \u2014 most common, matches method execution:\n```java\n// Syntax: execution(modifiers? return-type declaring-type? method-name(params) throws?)\n\n// All methods in service package\n\"execution(* com.example.service.*.*(..))\"\n\n// Specific method\n\"execution(public String com.example.UserService.findById(Long))\"\n\n// All public methods\n\"execution(public * *(..))\"\n\n// All setter methods\n\"execution(* set*(..))\"\n\n// Method returning specific type\n\"execution(List com.example..*.*(..))\"\n```\n\nwithin() \u2014 matches all methods within a type/package:\n```java\n\"within(com.example.service.*)\"         // all classes in package\n\"within(com.example..*)\"                // all classes in package and subpackages\n```\n\n@annotation() \u2014 matches methods annotated with a specific annotation:\n```java\n\"@annotation(org.springframework.transaction.annotation.Transactional)\"\n\"@annotation(com.example.annotation.Retry)\"\n```\n\n@within() \u2014 matches all methods in classes with a specific annotation:\n```java\n\"@within(org.springframework.stereotype.Service)\"\n```\n\nCombining with &&, ||, !:\n```java\n\"execution(* com.example.service.*.*(..)) && !execution(* com.example.service.*.get*(..))\"\n```\n\nNamed pointcuts (reusable):\n```java\n@Pointcut(\"execution(* com.example.service.*.*(..))\")\npublic void serviceLayer() {}\n\n@Before(\"serviceLayer()\")\npublic void logBefore() { ... }\n```"}, {"q": "What is Spring's @Transactional and how does transaction management work?", "a": "@Transactional tells Spring to wrap the method in a database transaction \u2014 it commits on success and rolls back on exception.\n\nBasic usage:\n```java\n@Service\npublic class OrderService {\n\n    @Transactional\n    public void placeOrder(Order order) {\n        orderRepo.save(order);\n        paymentService.charge(order); // if this throws, entire tx rolls back\n        inventoryService.deduct(order);\n    }\n\n    @Transactional(readOnly = true) // optimized for reads \u2014 no dirty checking\n    public List<Order> getAllOrders() {\n        return orderRepo.findAll();\n    }\n}\n```\n\nKey attributes:\n```java\n@Transactional(\n    propagation = Propagation.REQUIRED,      // default: join existing or create new\n    isolation   = Isolation.READ_COMMITTED,  // default varies by DB\n    rollbackFor = Exception.class,           // rollback on checked exceptions too\n    noRollbackFor = ItemNotFoundException.class,\n    timeout     = 30                         // seconds\n)\n```\n\nPropagation types:\n\u2022 REQUIRED (default) \u2014 join existing transaction or create new one.\n\u2022 REQUIRES_NEW \u2014 always create a new transaction, suspend existing.\n\u2022 NESTED \u2014 nested transaction within existing (savepoint-based).\n\u2022 SUPPORTS \u2014 join if exists, run non-transactionally if not.\n\u2022 NOT_SUPPORTED \u2014 always run non-transactionally, suspend existing.\n\u2022 NEVER \u2014 throw exception if transaction exists.\n\u2022 MANDATORY \u2014 must run within existing transaction.\n\n\u26a0\ufe0f Common gotcha: @Transactional only works on public methods called from OUTSIDE the bean (Spring AOP proxy). Self-invocation within the same class bypasses the proxy!"}, {"q": "What is the difference between Spring's @Component, @Bean, and @Configuration?", "a": "@Component:\n\u2022 Class-level annotation. Spring auto-detects it via component scanning.\n\u2022 The class itself IS the bean.\n```java\n@Component\npublic class EmailService { ... } // Spring creates and manages this\n```\n\n@Bean:\n\u2022 Method-level annotation inside a @Configuration class.\n\u2022 Gives you full control over bean creation (useful for third-party classes you can't annotate).\n```java\n@Configuration\npublic class AppConfig {\n    @Bean\n    public ObjectMapper objectMapper() {\n        return new ObjectMapper()\n            .configure(DeserializationFeature.FAIL_ON_UNKNOWN_PROPERTIES, false);\n    }\n\n    @Bean\n    public RestTemplate restTemplate() {\n        return new RestTemplate();\n    }\n}\n```\n\n@Configuration:\n\u2022 Marks a class as a source of @Bean definitions.\n\u2022 Uses CGLIB proxying \u2014 calling one @Bean method from another inside @Configuration returns the same singleton instance (not a new one).\n\n```java\n@Configuration\npublic class DataConfig {\n    @Bean\n    public DataSource dataSource() { return new HikariDataSource(config()); }\n\n    @Bean\n    public JdbcTemplate jdbcTemplate() {\n        return new JdbcTemplate(dataSource()); // returns SAME singleton DataSource\n    }\n}\n```\n\n\ud83d\udccc @Component + component scanning = convention. @Bean + @Configuration = explicit control."}, {"q": "How does Spring handle Events? What is ApplicationEvent?", "a": "Spring provides a built-in event mechanism for loose coupling between components using the Observer pattern.\n\nPublishing a custom event:\n```java\n// 1. Define event\npublic class OrderPlacedEvent extends ApplicationEvent {\n    private final Order order;\n    public OrderPlacedEvent(Object source, Order order) {\n        super(source);\n        this.order = order;\n    }\n    public Order getOrder() { return order; }\n}\n\n// 2. Publish event\n@Service\npublic class OrderService {\n    @Autowired\n    private ApplicationEventPublisher publisher;\n\n    @Transactional\n    public void placeOrder(Order order) {\n        orderRepo.save(order);\n        publisher.publishEvent(new OrderPlacedEvent(this, order));\n    }\n}\n\n// 3. Listen to event\n@Component\npublic class EmailNotifier {\n    @EventListener\n    public void onOrderPlaced(OrderPlacedEvent event) {\n        emailService.send(\"Order confirmed: \" + event.getOrder().getId());\n    }\n\n    @EventListener\n    @Async // handle in separate thread\n    public void onOrderPlacedAsync(OrderPlacedEvent event) {\n        smsService.send(event.getOrder().getPhone(), \"Your order is confirmed!\");\n    }\n}\n```\n\nBuilt-in Spring events:\n\u2022 ContextRefreshedEvent \u2014 context fully initialized.\n\u2022 ContextStartedEvent / ContextStoppedEvent \u2014 on start/stop.\n\u2022 ContextClosedEvent \u2014 on shutdown.\n\u2022 RequestHandledEvent \u2014 after HTTP request (MVC only).\n\nSimplified (Spring 4.2+) \u2014 no need to extend ApplicationEvent:\n```java\npublisher.publishEvent(new OrderPlacedEvent(this, order)); // or any POJO\n@EventListener\npublic void handle(MyPojo event) { ... }\n```"}, {"q": "What is Spring's Environment and how do you inject properties?", "a": "Spring's Environment abstraction provides access to configuration properties from multiple sources (files, env vars, command line, etc.).\n\nInjecting individual properties:\n```java\n@Component\npublic class AppConfig {\n\n    @Value(\"${app.name}\")\n    private String appName;\n\n    @Value(\"${app.timeout:30}\") // default value = 30\n    private int timeout;\n\n    @Value(\"${app.features.enabled:false}\")\n    private boolean featureEnabled;\n}\n```\n\nBinding to a typed POJO (@ConfigurationProperties):\n```java\n// application.yml\n// app:\n//   name: MyApp\n//   timeout: 30\n//   db:\n//     url: jdbc:mysql://localhost/mydb\n//     pool-size: 10\n\n@ConfigurationProperties(prefix = \"app\")\n@Component\npublic class AppProperties {\n    private String name;\n    private int timeout;\n    private Db db;\n\n    public static class Db {\n        private String url;\n        private int poolSize;\n        // getters/setters\n    }\n    // getters/setters\n}\n```\n\nAccessing via Environment programmatically:\n```java\n@Autowired\nprivate Environment env;\n\nString dbUrl = env.getProperty(\"app.db.url\");\nint port = env.getProperty(\"server.port\", Integer.class, 8080);\n```\n\nProperty sources priority (highest to lowest):\n1. Command-line args\n2. JVM system properties\n3. OS environment variables\n4. application-{profile}.yml\n5. application.yml"}, {"q": "What are Spring Profiles and how do you use them?", "a": "Profiles allow you to register different beans or configuration for different environments (dev, test, prod).\n\nActivating a profile:\n```bash\n# application.properties\nspring.profiles.active=dev\n\n# Command line\njava -jar app.jar --spring.profiles.active=prod\n\n# Multiple profiles\nspring.profiles.active=prod,metrics\n```\n\nProfile-specific beans:\n```java\n@Configuration\n@Profile(\"dev\")\npublic class DevConfig {\n    @Bean\n    public DataSource dataSource() {\n        return new EmbeddedDatabaseBuilder().setType(H2).build(); // in-memory H2\n    }\n}\n\n@Configuration\n@Profile(\"prod\")\npublic class ProdConfig {\n    @Bean\n    public DataSource dataSource() {\n        return new HikariDataSource(prodConfig()); // real DB\n    }\n}\n```\n\nProfile-specific properties files:\n```\napplication.yml           \u2190 always loaded\napplication-dev.yml       \u2190 loaded when dev profile is active\napplication-prod.yml      \u2190 loaded when prod profile is active\napplication-test.yml      \u2190 loaded during tests\n```\n\nIn tests:\n```java\n@SpringBootTest\n@ActiveProfiles(\"test\")\nclass OrderServiceTest {\n    // uses application-test.yml and @Profile(\"test\") beans\n}\n```"}, {"q": "What is the difference between BeanFactory and ApplicationContext?", "a": "BeanFactory is the root interface of the Spring IoC container. ApplicationContext extends it with enterprise features.\n\nBeanFactory:\n\u2022 Basic DI container.\n\u2022 Lazy initialization \u2014 beans created only when first requested.\n\u2022 Lightweight \u2014 useful for very resource-constrained environments.\n\u2022 Does not support AOP, events, or i18n out of the box.\n\u2022 Rarely used directly today.\n\nApplicationContext (extends BeanFactory):\n\u2022 Eager initialization \u2014 all singleton beans created at startup.\n\u2022 Supports @Autowired, @PostConstruct, @PreDestroy.\n\u2022 Built-in AOP integration.\n\u2022 Event publishing (ApplicationEvent / @EventListener).\n\u2022 Internationalization (MessageSource).\n\u2022 Resource loading (ResourceLoader).\n\u2022 Environment / property management.\n\nCommon implementations:\n```java\n// For annotation-based config (most common in Spring Boot)\nApplicationContext ctx = new AnnotationConfigApplicationContext(AppConfig.class);\n\n// For XML config (legacy)\nApplicationContext ctx = new ClassPathXmlApplicationContext(\"beans.xml\");\n\n// For web apps\n// WebApplicationContext \u2014 created and managed by DispatcherServlet\n```\n\n```java\n// Getting a bean from context\nOrderService os = ctx.getBean(OrderService.class);\nOrderService os = (OrderService) ctx.getBean(\"orderService\");\n```\n\n\ud83d\udccc Always use ApplicationContext in modern Spring apps. BeanFactory is mostly an implementation detail."}, {"q": "What is Spring MVC and how does the DispatcherServlet work?", "a": "Spring MVC is a web framework built on the Front Controller pattern. The DispatcherServlet is the single entry point that routes all HTTP requests.\n\nRequest lifecycle:\n```\nClient Request\n    \u2193\nDispatcherServlet (Front Controller)\n    \u2193\nHandlerMapping \u2014 finds the right @Controller method\n    \u2193\nHandlerAdapter \u2014 invokes the controller method\n    \u2193\n@Controller method \u2014 processes request, returns result\n    \u2193\nViewResolver \u2014 resolves view name to actual view (for MVC)\n    |          OR\n    \u2193\nHttpMessageConverter \u2014 serializes return value to JSON/XML (for REST)\n    \u2193\nResponse to Client\n```\n\nSimple REST Controller:\n```java\n@RestController\n@RequestMapping(\"/api/users\")\npublic class UserController {\n\n    @GetMapping(\"/{id}\")\n    public ResponseEntity<User> getUser(@PathVariable Long id) {\n        return userService.findById(id)\n            .map(ResponseEntity::ok)\n            .orElse(ResponseEntity.notFound().build());\n    }\n\n    @PostMapping\n    public ResponseEntity<User> createUser(@Valid @RequestBody UserDto dto) {\n        User created = userService.create(dto);\n        URI location = URI.create(\"/api/users/\" + created.getId());\n        return ResponseEntity.created(location).body(created);\n    }\n\n    @PutMapping(\"/{id}\")\n    public User updateUser(@PathVariable Long id, @RequestBody UserDto dto) {\n        return userService.update(id, dto);\n    }\n\n    @DeleteMapping(\"/{id}\")\n    public ResponseEntity<Void> deleteUser(@PathVariable Long id) {\n        userService.delete(id);\n        return ResponseEntity.noContent().build();\n    }\n}\n```"}, {"q": "What is the difference between @Controller and @RestController? What are common MVC annotations?", "a": "@Controller vs @RestController:\n\u2022 @Controller \u2014 returns view names (resolved by ViewResolver to HTML templates).\n\u2022 @RestController = @Controller + @ResponseBody \u2014 returns data directly as JSON/XML.\n\n```java\n@Controller\npublic class PageController {\n    @GetMapping(\"/dashboard\")\n    public String dashboard(Model model) {\n        model.addAttribute(\"user\", getCurrentUser());\n        return \"dashboard\"; // resolves to dashboard.html (Thymeleaf/etc)\n    }\n}\n\n@RestController\npublic class ApiController {\n    @GetMapping(\"/api/users\")\n    public List<User> getUsers() {\n        return userService.findAll(); // serialized to JSON automatically\n    }\n}\n```\n\nCommon MVC Annotations:\n\nMapping:\n\u2022 @GetMapping, @PostMapping, @PutMapping, @DeleteMapping, @PatchMapping\n\u2022 @RequestMapping(method = RequestMethod.GET, path = \"/...\")\n\nParameters:\n```java\n@GetMapping(\"/users/{id}\")\npublic User get(\n    @PathVariable Long id,                   // from URL path\n    @RequestParam(defaultValue=\"0\") int page, // ?page=1 query param\n    @RequestHeader(\"Authorization\") String token, // from header\n    @CookieValue(\"session\") String session,  // from cookie\n    @RequestBody UserDto dto,                // request body (POST/PUT)\n    @Valid @RequestBody UserDto validDto,    // with validation\n    HttpServletRequest request              // raw request\n) { ... }\n```\n\nResponse:\n\u2022 @ResponseBody \u2014 write return value directly to response body.\n\u2022 @ResponseStatus(HttpStatus.CREATED) \u2014 set HTTP status.\n\u2022 ResponseEntity<T> \u2014 full control over status, headers, body."}], "springboot": [{"q": "What is Spring Boot and how does it differ from Spring Framework?", "a": "Spring Framework: A comprehensive IoC/DI container with modules for Web MVC, Security, Data, etc. Requires extensive XML/Java configuration.\n\nSpring Boot: An opinionated wrapper around Spring that provides:\n\u2022 Auto-configuration: Automatically configures beans based on classpath dependencies.\n\u2022 Starter POMs: Curated dependency bundles (e.g., spring-boot-starter-web).\n\u2022 Embedded server: Ships with Tomcat/Jetty \u2014 no WAR deployment needed.\n\u2022 Actuator: Built-in health checks, metrics, and monitoring endpoints.\n\u2022 No boilerplate: Convention over configuration."}, {"q": "Explain Spring Boot Auto-Configuration.", "a": "Auto-configuration automatically sets up Spring beans based on what is on the classpath and your properties.\n\nHow it works:\n1. @SpringBootApplication includes @EnableAutoConfiguration.\n2. Spring Boot reads META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports.\n3. Each config class is annotated with conditions like:\n   - @ConditionalOnClass: Only if class is on classpath.\n   - @ConditionalOnMissingBean: Only if no user-defined bean exists.\n\n```java\n// Spring Boot auto-configures DataSource when you add spring-boot-starter-data-jpa\n// Just define in application.properties:\nspring.datasource.url=jdbc:mysql://localhost:3306/mydb\nspring.datasource.username=root\nspring.datasource.password=secret\n```"}, {"q": "What is the difference between @Component, @Service, @Repository, and @Controller?", "a": "All are specializations of @Component (Spring-managed beans), but carry semantic meaning:\n\n\u2022 @Component: Generic bean. Used for any Spring-managed class.\n\u2022 @Service: Business logic layer. No extra functionality \u2014 purely semantic.\n\u2022 @Repository: Data access layer. Additionally translates SQL/persistence exceptions into Spring's DataAccessException.\n\u2022 @Controller: Web MVC layer. Handles HTTP requests and returns views.\n\u2022 @RestController: = @Controller + @ResponseBody. Returns JSON/XML directly (for REST APIs)."}, {"q": "What is Dependency Injection (DI) and how does Spring implement it?", "a": "DI is a design pattern where objects receive their dependencies from an external source rather than creating them.\n\nSpring supports 3 types:\n\nConstructor Injection (recommended \u2014 immutable, testable):\n```java\n@Service\npublic class OrderService {\n    private final PaymentService paymentService;\n    public OrderService(PaymentService paymentService) {\n        this.paymentService = paymentService;\n    }\n}\n```\n\nSetter Injection: For optional dependencies.\nField Injection (@Autowired on field): Convenient but not recommended \u2014 hard to test.\n\n\ud83d\udccc Prefer constructor injection \u2014 it makes dependencies explicit and classes easier to unit test."}, {"q": "How does Spring Boot handle externalized configuration?", "a": "Spring Boot supports hierarchical configuration sources (higher priority overrides lower):\n\n1. Command-line arguments\n2. OS environment variables\n3. application-{profile}.properties/yml\n4. application.properties/yml\n\nProfiles:\n```bash\njava -jar app.jar --spring.profiles.active=dev\n```\n\nBind to typed POJOs:\n```java\n@ConfigurationProperties(prefix = \"app\")\n@Component\npublic class AppConfig {\n    private String name;\n    private int timeout;\n    // getters/setters\n}\n```"}, {"q": "What is Spring Data JPA and how does it simplify database access?", "a": "Spring Data JPA reduces boilerplate by auto-implementing repository interfaces.\n\n```java\n@Entity\npublic class User {\n    @Id @GeneratedValue\n    private Long id;\n    private String name;\n    private String email;\n}\n\npublic interface UserRepository extends JpaRepository<User, Long> {\n    List<User> findByName(String name);  // derived query\n\n    @Query(\"SELECT u FROM User u WHERE u.email = :email\")\n    Optional<User> findByEmail(@Param(\"email\") String email);\n}\n```\n\nFeatures: Pagination, sorting, @Transactional, auditing (@CreatedDate), projections, and Specifications for dynamic queries."}, {"q": "What is Spring Security and how do you implement JWT authentication?", "a": "Spring Security provides authentication, authorization, and protection against attacks (CSRF, XSS).\n\nJWT Flow:\n1. User logs in \u2192 server validates credentials \u2192 returns JWT token.\n2. Client sends JWT in Authorization: Bearer <token> header.\n3. Server validates JWT on each request.\n\n```java\n@Configuration\npublic class SecurityConfig {\n    @Bean\n    public SecurityFilterChain filterChain(HttpSecurity http) throws Exception {\n        http.csrf().disable()\n            .authorizeHttpRequests(auth -> auth\n                .requestMatchers(\"/api/auth/**\").permitAll()\n                .anyRequest().authenticated()\n            )\n            .sessionManagement(s -> s.sessionCreationPolicy(STATELESS))\n            .addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class);\n        return http.build();\n    }\n}\n```"}, {"q": "What is Spring Boot Actuator and what endpoints does it expose?", "a": "Actuator provides production-ready monitoring and management endpoints.\n\nCommon endpoints (/actuator/...):\n\u2022 /health    \u2014 Application health status (DB, disk, etc.)\n\u2022 /metrics   \u2014 JVM, CPU, memory, HTTP stats\n\u2022 /env       \u2014 Active environment properties\n\u2022 /beans     \u2014 All Spring beans\n\u2022 /mappings  \u2014 All @RequestMapping routes\n\u2022 /loggers   \u2014 View/change log levels at runtime\n\u2022 /threaddump \u2014 JVM thread dump\n\n```properties\nmanagement.endpoints.web.exposure.include=health,metrics,info\nmanagement.endpoint.health.show-details=always\n```\n\n\ud83d\udccc Integrates natively with Prometheus + Grafana for dashboards."}, {"q": "How do you handle global exception handling in Spring Boot?", "a": "Use @ControllerAdvice + @ExceptionHandler for centralized error handling.\n\n```java\n@RestControllerAdvice\npublic class GlobalExceptionHandler {\n\n    @ExceptionHandler(ResourceNotFoundException.class)\n    public ResponseEntity<ErrorResponse> handleNotFound(ResourceNotFoundException ex) {\n        return ResponseEntity.status(HttpStatus.NOT_FOUND)\n            .body(new ErrorResponse(\"NOT_FOUND\", ex.getMessage()));\n    }\n\n    @ExceptionHandler(MethodArgumentNotValidException.class)\n    public ResponseEntity<ErrorResponse> handleValidation(MethodArgumentNotValidException ex) {\n        String msg = ex.getBindingResult().getFieldErrors()\n            .stream().map(FieldError::getDefaultMessage).collect(joining(\", \"));\n        return ResponseEntity.badRequest()\n            .body(new ErrorResponse(\"VALIDATION_ERROR\", msg));\n    }\n}\n```"}], "microservices": [{"q": "What are Microservices and how do they differ from Monolith?", "a": "Monolith: Single deployable unit. All modules tightly coupled. Easier to start, harder to scale.\n\nMicroservices: Application split into small, independent services, each:\n\u2022 Owning its own data/database.\n\u2022 Deployed independently.\n\u2022 Communicating via APIs (REST/gRPC) or messaging (Kafka, RabbitMQ).\n\u2022 Built around a specific business capability.\n\nTrade-offs:\n              | Monolith      | Microservices\n--------------|---------------|---------------\nDeployment    | Single        | Independent\nScaling       | Full app      | Per service\nComplexity    | Low           | High\nData          | Shared DB     | Per-service DB"}, {"q": "What are the key design principles of Microservices?", "a": "\u2022 Single Responsibility: Each service does one thing well.\n\u2022 Loose Coupling: Services are independent \u2014 change one without affecting others.\n\u2022 High Cohesion: Related logic lives within one service.\n\u2022 API First: Contract-driven design (OpenAPI/Swagger).\n\u2022 Database per Service: No shared DBs \u2014 prevents tight coupling at the data layer.\n\u2022 Fault Tolerance: Services should degrade gracefully (Circuit Breaker pattern).\n\u2022 Observability: Centralized logging, distributed tracing, metrics (ELK, Zipkin, Prometheus)."}, {"q": "What is Service Discovery and how does it work?", "a": "Services need to find each other dynamically (IPs change on restart/scaling).\n\nClient-side discovery (Netflix Eureka):\n- Client queries a registry, gets list of instances, load-balances itself.\n\nServer-side discovery (AWS ALB, Kubernetes):\n- Client calls a load balancer; it queries registry and routes the request.\n\n```yaml\n# Spring Eureka Client config\neureka:\n  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka\n```\n\nTools: Eureka, Consul, Zookeeper, Kubernetes DNS."}, {"q": "What is the Circuit Breaker pattern and why is it needed?", "a": "Prevents cascading failures when a downstream service is slow or down.\n\nStates:\n\u2022 Closed (normal): Requests pass through. Failures are counted.\n\u2022 Open (tripped): All requests fail fast without calling the service.\n\u2022 Half-Open (recovery): Limited requests allowed; if they succeed, circuit closes.\n\n```java\n// Resilience4j\n@CircuitBreaker(name = \"paymentService\", fallbackMethod = \"fallback\")\npublic String callPayment() { ... }\n\npublic String fallback(Exception e) { return \"Service unavailable\"; }\n```\n\nTools: Resilience4j (modern), Hystrix (Netflix, deprecated)."}, {"q": "What is the API Gateway pattern?", "a": "API Gateway is the single entry point for all client requests. It handles:\n\n\u2022 Routing: Forward requests to appropriate microservices.\n\u2022 Authentication/Authorization: Validate tokens (JWT/OAuth2).\n\u2022 Rate Limiting: Throttle abusive clients.\n\u2022 Load Balancing: Distribute traffic.\n\u2022 SSL Termination: Handle HTTPS at the edge.\n\u2022 Response Aggregation: Combine responses from multiple services.\n\nTools: Spring Cloud Gateway, AWS API Gateway, Kong, NGINX, Istio."}, {"q": "How do microservices communicate? REST vs gRPC vs Messaging.", "a": "Synchronous (request-response):\n\u2022 REST (HTTP/JSON): Simple, universal, human-readable. Higher latency.\n\u2022 gRPC (HTTP/2 + Protobuf): Strongly typed, binary, fast. Great for internal service-to-service.\n\nAsynchronous (event-driven):\n\u2022 Kafka: High-throughput, persistent event streaming. Ordered, replayable.\n\u2022 RabbitMQ: Queue-based messaging. Good for task queues.\n\u2022 SQS/SNS: AWS managed messaging.\n\n\ud83d\udccc Use REST for external APIs, gRPC for internal performance-critical calls, and Kafka/RabbitMQ for decoupled async workflows."}, {"q": "What is the Saga Pattern for distributed transactions?", "a": "In microservices, you cannot use traditional ACID transactions across services. Saga breaks a transaction into a sequence of local transactions with compensating transactions on failure.\n\nChoreography Saga (event-driven):\n- Each service publishes events; others react. No central coordinator.\n\nOrchestration Saga:\n- A central orchestrator (Saga manager) calls each service in sequence and handles failures.\n\nExample \u2014 Order flow:\nOrder Created \u2192 Payment Charged \u2192 Inventory Reserved\nOn failure: Inventory Rollback \u2192 Payment Refund \u2192 Order Cancelled\n\nTools: Temporal, Axon Framework, AWS Step Functions."}, {"q": "What is the Strangler Fig pattern?", "a": "A migration strategy for incrementally replacing a monolith with microservices \u2014 without a big-bang rewrite.\n\nProcess:\n1. Put an API Gateway/Facade in front of the monolith.\n2. Identify and extract one domain/capability as a new microservice.\n3. Route traffic for that capability to the new service.\n4. Repeat until the monolith is fully replaced.\n\nNamed after the strangler fig tree, which grows around a host tree until the host dies.\n\n\ud83d\udccc This is the safest, lowest-risk migration strategy for legacy systems."}], "devops": [{"q": "What is DevOps and what problems does it solve?", "a": "DevOps is a cultural and technical movement that unifies software Development (Dev) and IT Operations (Ops) to shorten the delivery cycle, improve deployment frequency, and increase reliability.\n\nProblems it solves:\n\u2022 \"Works on my machine\" \u2014 consistent environments via containers and IaC.\n\u2022 Slow releases \u2014 manual deployments replaced by automated CI/CD pipelines.\n\u2022 Siloed teams \u2014 shared ownership of build, deploy, and run responsibilities.\n\u2022 Late bug discovery \u2014 automated testing and monitoring catch issues earlier.\n\u2022 Manual config drift \u2014 infrastructure treated as code, version controlled.\n\nCore DevOps practices:\n\u2022 Continuous Integration (CI) \u2014 merge and test code frequently.\n\u2022 Continuous Delivery (CD) \u2014 always have a deployable artifact.\n\u2022 Infrastructure as Code (IaC) \u2014 Terraform, Ansible, CloudFormation.\n\u2022 Monitoring & Observability \u2014 logs, metrics, traces (ELK, Prometheus, Jaeger).\n\u2022 Shift Left \u2014 testing and security done earlier in the lifecycle.\n\u2022 Blameless postmortems \u2014 learnin
