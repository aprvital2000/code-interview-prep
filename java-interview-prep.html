<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0d1117;
    color: #e6edf3;

  }
  header {

    padding: 28px 24px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    transition: transform 0.3s ease;
  }
  header.hidden { transform: translateY(-100%); }
  .header-inner { max-width: 1400px; margin: 0 auto; }
  .header-title { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .header-title span.icon { font-size: 32px; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg, #f0883e, #58a6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .subtitle { font-size: 12px; color: #8b949e; margin-top: 2px; }
  #search {
    width: 100%;
    margin-top: 16px;
    padding: 10px 16px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #search:focus { border-color: #58a6ff; }
  .tabs { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #30363d;
    background: #161b22;
    color: #8b949e;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab.active {
    border-color: #58a6ff;
    background: rgba(88,166,255,0.15);
    color: #58a6ff;
    font-weight: 700;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 24px 24px 60px; }
  .meta { margin-bottom: 16px; color: #8b949e; font-size: 13px; }
  .meta strong { color: #e6edf3; }
  .card {
    margin-bottom: 12px;
    border: 1px solid #21262d;
    border-radius: 10px;
    overflow: hidden;
    background: #161b22;
    transition: border-color 0.2s;
  }
  .card.open { border-color: rgba(88,166,255,0.4); }
  .question-btn {
    width: 100%;
    text-align: left;
    padding: 18px 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    color: #e6edf3;
    font-family: inherit;
    transition: background 0.2s;
  }
  .card.open .question-btn { background: rgba(88,166,255,0.05); }
  .q-left { display: flex; gap: 14px; align-items: flex-start; }
  .q-num {
    min-width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(88,166,255,0.15);
    color: #58a6ff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;

  }

  .chevron {
    font-size: 20px;
    color: #58a6ff;
    transition: transform 0.2s;
    flex-shrink: 0;
    margin-top: 2px;
    display: inline-block;
  }
  .card.open .chevron { transform: rotate(180deg); }
  .answer-wrap {
    display: none;

    border-top: 1px solid #21262d;
  }
  .card.open .answer-wrap { display: block; }
  .go-top {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 5px 12px;
    border-radius: 20px;

    background: #0d1117;
    color: #8b949e;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .go-top:hover { border-color: #58a6ff; color: #58a6ff; }
  .answer-box {
    background: #0d1117;
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 14px;

    margin-top: 16px;
    border-left: 3px solid #58a6ff;
  }

    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px 16px;
    overflow-x: auto;
    color: #f0883e;
    font-size: 13px;
    margin: 10px 0;
    font-family: inherit;

<script id="qa-data" type="application/json">
{"core": [{"q": "What is the difference between JDK, JRE, and JVM?", "a": "\u2022 JVM (Java Virtual Machine): An abstract machine that executes Java bytecode. It provides a runtime environment and is platform-specific.\n\u2022 JRE (Java Runtime Environment): Includes JVM + core libraries needed to run Java applications. It does NOT include development tools.\n\u2022 JDK (Java Development Kit): A superset of JRE \u2014 includes JRE + compiler (javac), debugger, and other development tools needed to write and compile Java code.\n\n\ud83d\udccc Rule of thumb: To run Java \u2192 JRE. To develop Java \u2192 JDK."}, {"q": "What are the four pillars of OOP in Java?", "a": "\u2022 Encapsulation: Bundling data (fields) and methods into a class, hiding internal state via access modifiers (private, protected, public).\n\u2022 Abstraction: Hiding implementation complexity. Achieved via abstract classes and interfaces.\n\u2022 Inheritance: A class (child) acquires properties/behaviors of another class (parent) using 'extends'.\n\u2022 Polymorphism: One interface, multiple implementations. Compile-time (method overloading) and runtime (method overriding via @Override)."}, {"q": "What is the difference between == and .equals() in Java?", "a": "\u2022 == compares object references (memory addresses). For primitives, it compares values.\n\u2022 .equals() compares object content/value. It is overridden in classes like String, Integer, etc.\n\n```java\nString a = new String(\"hello\");\nString b = new String(\"hello\");\na == b       // false \u2014 different objects\na.equals(b)  // true  \u2014 same content\n```\n\n\ud83d\udccc Always use .equals() for String comparison. Use Objects.equals(a, b) to also handle nulls safely."}, {"q": "What is the difference between HashMap, LinkedHashMap, and TreeMap?", "a": "\u2022 HashMap: No guaranteed order. O(1) average for get/put. Allows one null key.\n\u2022 LinkedHashMap: Maintains insertion order. Slightly slower than HashMap due to linked list overhead.\n\u2022 TreeMap: Maintains natural/sorted order of keys. O(log n) for get/put. Does not allow null keys.\n\n\ud83d\udccc Use HashMap for performance, LinkedHashMap when order matters, TreeMap when sorted keys are needed."}, {"q": "What is the difference between checked and unchecked exceptions?", "a": "\u2022 Checked Exceptions: Must be declared with 'throws' or caught. Checked at compile time. Examples: IOException, SQLException.\n\u2022 Unchecked Exceptions: Subclasses of RuntimeException. Not required to be caught/declared. Examples: NullPointerException, ArrayIndexOutOfBoundsException.\n\u2022 Error: Serious JVM-level problems (not meant to be caught). Examples: OutOfMemoryError, StackOverflowError."}, {"q": "What is the difference between String, StringBuilder, and StringBuffer?", "a": "\u2022 String: Immutable. Every modification creates a new object. Thread-safe by nature.\n\u2022 StringBuilder: Mutable, faster, but NOT thread-safe. Preferred for single-threaded string manipulation.\n\u2022 StringBuffer: Mutable, thread-safe (synchronized methods), but slower than StringBuilder.\n\n\ud83d\udccc For concatenation in loops \u2192 use StringBuilder. For multi-threaded string building \u2192 StringBuffer."}, {"q": "What is the difference between abstract class and interface?", "a": "Feature            | Abstract Class      | Interface\n-------------------|---------------------|-------------------\nInstantiation      | Cannot              | Cannot\nMethods            | Abstract + concrete | Default, static, abstract\nVariables          | Any type            | public static final only\nInheritance        | Single              | Multiple\nConstructor        | Yes                 | No\n\n\ud83d\udccc Java 8+ interfaces can have default and static methods. Java 9+ allows private methods in interfaces.\nUse abstract class for shared base behavior; interface for capability contracts."}, {"q": "Explain the concept of Generics in Java.", "a": "Generics allow you to write type-safe, reusable code by parameterizing types.\n\n```java\nList<String> list = new ArrayList<>(); // Only Strings allowed\nlist.add(\"hello\");\nString s = list.get(0); // No cast needed\n```\n\nKey concepts:\n\u2022 Type erasure: Generic type info is removed at runtime (compile-time only).\n\u2022 Wildcards: ? (unknown), ? extends T (upper bound), ? super T (lower bound).\n\u2022 Bounded types: <T extends Comparable<T>> restricts T to types implementing Comparable."}, {"q": "What is the difference between final, finally, and finalize?", "a": "\u2022 final: Keyword \u2014 makes a variable constant, prevents method overriding, prevents class inheritance.\n\u2022 finally: Block in try-catch \u2014 always executes (even if exception thrown or return used), used for cleanup.\n\u2022 finalize(): Method \u2014 called by GC before object is garbage collected. Deprecated since Java 9; unreliable \u2014 avoid it."}], "collections": [{"q": "What is the Java Collections Framework? Give an overview.", "a": "The Java Collections Framework (JCF) is a unified architecture for storing, retrieving, and manipulating groups of objects. It lives in java.util.\n\nCore interfaces hierarchy:\n```\nIterable\n \u2514\u2500\u2500 Collection\n      \u251c\u2500\u2500 List       \u2192 ArrayList, LinkedList, Vector, Stack\n      \u251c\u2500\u2500 Set        \u2192 HashSet, LinkedHashSet, TreeSet\n      \u2514\u2500\u2500 Queue      \u2192 PriorityQueue, ArrayDeque\n           \u2514\u2500\u2500 Deque \u2192 ArrayDeque, LinkedList\n\nMap (separate hierarchy)\n \u251c\u2500\u2500 HashMap, LinkedHashMap, TreeMap\n \u251c\u2500\u2500 Hashtable (legacy)\n \u2514\u2500\u2500 ConcurrentHashMap\n```\n\nKey benefits:\n\u2022 Reduces programming effort (no need to write data structures from scratch).\n\u2022 Increases performance (optimized implementations).\n\u2022 Provides interoperability via common interfaces.\n\u2022 Supports algorithms: Collections.sort(), Collections.binarySearch(), Collections.shuffle()."}, {"q": "What is the difference between ArrayList and LinkedList?", "a": "Both implement List, but use different internal data structures.\n\nArrayList:\n\u2022 Backed by a dynamic array.\n\u2022 O(1) random access by index.\n\u2022 O(n) insert/delete in the middle (elements must shift).\n\u2022 Better cache performance (contiguous memory).\n\u2022 Default choice for most use cases.\n\nLinkedList:\n\u2022 Doubly-linked list of nodes.\n\u2022 O(n) random access (must traverse).\n\u2022 O(1) insert/delete at head/tail.\n\u2022 More memory overhead (stores prev/next pointers per node).\n\u2022 Implements both List and Deque \u2014 can be used as a queue or stack.\n\n```java\nList<String> al = new ArrayList<>();   // fast reads, indexed\nList<String> ll = new LinkedList<>();  // fast insert/delete at ends\n```\n\n\ud83d\udccc Use ArrayList almost always. Use LinkedList only when you heavily insert/delete at both ends and rarely access by index."}, {"q": "What is the difference between HashSet, LinkedHashSet, and TreeSet?", "a": "All implement Set (no duplicates), but differ in ordering and performance.\n\n\u2022 HashSet:\n  - Backed by HashMap. No guaranteed order.\n  - O(1) average for add/remove/contains.\n  - Allows one null element.\n\n\u2022 LinkedHashSet:\n  - Backed by LinkedHashMap. Maintains insertion order.\n  - Slightly slower than HashSet due to linked list overhead.\n\n\u2022 TreeSet:\n  - Backed by TreeMap (Red-Black tree). Maintains natural/sorted order.\n  - O(log n) for add/remove/contains.\n  - Does NOT allow null.\n  - Implements NavigableSet \u2014 supports headSet(), tailSet(), floor(), ceiling().\n\n```java\nSet<String> hs  = new HashSet<>();        // no order\nSet<String> lhs = new LinkedHashSet<>();  // insertion order\nSet<String> ts  = new TreeSet<>();        // sorted order\n```"}, {"q": "How does HashMap work internally?", "a": "HashMap uses an array of buckets (Node[] table) plus chaining/tree for collision handling.\n\nSteps for put(key, value):\n1. Compute hash: hash = key.hashCode() ^ (hash >>> 16)\n2. Find bucket index: index = hash & (capacity - 1)\n3. If bucket is empty \u2192 insert new Node.\n4. If collision \u2192 append to linked list at that bucket.\n5. If chain length > 8 AND table size >= 64 \u2192 convert chain to Red-Black Tree (Java 8+).\n\nSteps for get(key):\n1. Compute hash \u2192 find bucket.\n2. Traverse chain/tree, compare with equals().\n3. Return matching value or null.\n\nKey parameters:\n\u2022 Default initial capacity: 16\n\u2022 Load factor: 0.75 (resize when 75% full)\n\u2022 Resize: doubles capacity and rehashes all entries.\n\n\ud83d\udccc Always override both hashCode() AND equals() when using objects as keys."}, {"q": "What is the difference between HashMap and Hashtable?", "a": "Both implement Map, but Hashtable is a legacy class from Java 1.0.\n\nFeature          | HashMap          | Hashtable\n-----------------|------------------|------------------\nThread-safe      | No               | Yes (synchronized)\nNull keys        | One null key OK  | Not allowed\nNull values      | Allowed          | Not allowed\nPerformance      | Faster           | Slower (sync overhead)\nIterator         | Fail-fast        | Enumerator (older)\nInheritance      | AbstractMap      | Dictionary (legacy)\n\n\ud83d\udccc Hashtable is considered obsolete. For thread safety, use:\n\u2022 ConcurrentHashMap \u2014 high-performance, thread-safe (preferred).\n\u2022 Collections.synchronizedMap(new HashMap<>()) \u2014 synchronized wrapper."}, {"q": "What is the difference between HashMap and ConcurrentHashMap?", "a": "HashMap is not thread-safe. ConcurrentHashMap is designed for concurrent access.\n\nHashMap problems in multi-threading:\n\u2022 Infinite loop during resize (Java 7 and earlier).\n\u2022 Lost updates when two threads write simultaneously.\n\u2022 Partial visibility of updates across threads.\n\nConcurrentHashMap (Java 8+):\n\u2022 Uses bucket-level locking (CAS + synchronized per bin).\n\u2022 Only locks the specific bucket being modified.\n\u2022 Reads are lock-free.\n\u2022 Does NOT allow null keys or values.\n\n```java\nConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();\nmap.put(\"a\", 1);\nmap.computeIfAbsent(\"b\", k -> expensiveCompute(k));\nmap.merge(\"a\", 1, Integer::sum); // atomic increment\n```\n\n\ud83d\udccc Use ConcurrentHashMap for all multi-threaded Map use cases. It's far more scalable than synchronizedMap."}, {"q": "What is the difference between Iterator and ListIterator?", "a": "Both are used to traverse collections, but with different capabilities.\n\nIterator:\n\u2022 Works with any Collection (List, Set, Queue).\n\u2022 Can only traverse FORWARD.\n\u2022 Methods: hasNext(), next(), remove().\n\nListIterator:\n\u2022 Works ONLY with List.\n\u2022 Can traverse FORWARD and BACKWARD.\n\u2022 Can add, set, and remove elements during iteration.\n\u2022 Methods: hasNext(), next(), hasPrevious(), previous(), add(), set(), remove(), nextIndex(), previousIndex().\n\n```java\nList<String> list = new ArrayList<>(List.of(\"A\", \"B\", \"C\"));\n\nListIterator<String> it = list.listIterator(list.size()); // start at end\nwhile (it.hasPrevious()) {\n    System.out.print(it.previous() + \" \"); // C B A\n}\n```\n\n\ud83d\udccc Modifying a collection during iteration without using iterator.remove() throws ConcurrentModificationException."}, {"q": "What is fail-fast vs fail-safe iterator?", "a": "Fail-fast Iterator:\n\u2022 Throws ConcurrentModificationException if the collection is modified during iteration (outside the iterator).\n\u2022 Works on the ORIGINAL collection directly.\n\u2022 Examples: Iterator from ArrayList, HashMap, HashSet.\n\n```java\nList<String> list = new ArrayList<>(List.of(\"A\", \"B\", \"C\"));\nfor (String s : list) {\n    list.remove(s); // ConcurrentModificationException!\n}\n```\n\nFail-safe Iterator:\n\u2022 Works on a SNAPSHOT/CLONE of the collection \u2014 no exception.\n\u2022 Changes to the original are NOT visible during iteration.\n\u2022 Examples: CopyOnWriteArrayList, ConcurrentHashMap.\n\n```java\nCopyOnWriteArrayList<String> list = new CopyOnWriteArrayList<>(List.of(\"A\",\"B\",\"C\"));\nfor (String s : list) {\n    list.remove(s); // No exception \u2014 iterates over a snapshot\n}\n```"}, {"q": "What is the difference between Queue and Deque? Name implementations.", "a": "Queue: Single-ended \u2014 add at tail, remove from head. FIFO.\nDeque (Double-Ended Queue): Can add/remove from BOTH ends.\n\nQueue methods:\n\u2022 offer(e) / add(e)   \u2014 insert at tail\n\u2022 poll() / remove()   \u2014 remove from head\n\u2022 peek() / element()  \u2014 view head (no remove)\n\nDeque adds:\n\u2022 offerFirst() / offerLast()\n\u2022 pollFirst() / pollLast()\n\u2022 peekFirst() / peekLast()\n\n```java\nDeque<String> deque = new ArrayDeque<>();\ndeque.addFirst(\"B\");\ndeque.addFirst(\"A\"); // A B\ndeque.addLast(\"C\");  // A B C\ndeque.pollFirst();   // A \u2192 removes A\ndeque.pollLast();    // C \u2192 removes C\n```\n\nImplementations:\n\u2022 ArrayDeque \u2014 array-backed, no nulls, faster than LinkedList for stack/queue use.\n\u2022 LinkedList \u2014 node-based, allows nulls.\n\u2022 PriorityQueue \u2014 orders by natural order or Comparator (not FIFO)."}, {"q": "How does PriorityQueue work? What is its internal data structure?", "a": "PriorityQueue is a min-heap by default. The smallest element is always at the head (peek/poll).\n\nInternal structure: Binary Min-Heap stored in an array.\n\u2022 Parent at index i \u2192 children at 2i+1 and 2i+2.\n\u2022 Insertion: O(log n) \u2014 add at end, then bubble up.\n\u2022 Removal (poll): O(log n) \u2014 remove root, move last to root, bubble down.\n\u2022 Peek: O(1).\n\n```java\nPriorityQueue<Integer> minPQ = new PriorityQueue<>();\nminPQ.offer(5); minPQ.offer(1); minPQ.offer(3);\nminPQ.poll(); // 1 (smallest)\nminPQ.poll(); // 3\n\n// Max-heap using reversed comparator\nPriorityQueue<Integer> maxPQ = new PriorityQueue<>(Comparator.reverseOrder());\nmaxPQ.offer(5); maxPQ.offer(1); maxPQ.offer(3);\nmaxPQ.poll(); // 5 (largest)\n\n// Custom object priority\nPriorityQueue<Task> taskQ = new PriorityQueue<>(\n    Comparator.comparingInt(Task::getPriority)\n);\n```"}, {"q": "What is the difference between Collections.sort() and List.sort()?", "a": "Both sort a List, but List.sort() (Java 8+) is the modern preferred approach.\n\nCollections.sort(list):\n\u2022 Static utility method in java.util.Collections.\n\u2022 Internally calls list.sort() since Java 8.\n\u2022 Accepts optional Comparator.\n\nList.sort(comparator):\n\u2022 Instance method on List (Java 8+).\n\u2022 More readable in method chains.\n\u2022 Pass null for natural ordering.\n\nBoth use TimSort \u2014 O(n log n), stable sort.\n\n```java\nList<String> names = new ArrayList<>(List.of(\"Charlie\", \"Alice\", \"Bob\"));\n\n// Classic\nCollections.sort(names);\n\n// Modern \u2014 preferred\nnames.sort(null);                               // natural order\nnames.sort(Comparator.reverseOrder());          // reverse\nnames.sort(Comparator.comparingInt(String::length)); // by length\n\n// Stream sort (returns new list, doesn't mutate)\nList<String> sorted = names.stream().sorted().collect(Collectors.toList());\n```"}, {"q": "What are the thread-safe Collection alternatives in Java?", "a": "Non-synchronized collections (ArrayList, HashMap, HashSet) are NOT thread-safe.\n\nOptions for thread safety:\n\n1. Legacy synchronized classes (avoid):\n   - Vector, Hashtable \u2014 synchronized on every method, poor performance.\n\n2. Collections wrapper methods:\n```java\nList<String>  syncList = Collections.synchronizedList(new ArrayList<>());\nMap<K,V>      syncMap  = Collections.synchronizedMap(new HashMap<>());\n```\n\n3. java.util.concurrent package (preferred):\n```java\nConcurrentHashMap<K,V>        // high-throughput thread-safe Map\nCopyOnWriteArrayList<E>       // safe iteration; writes copy the array\nCopyOnWriteArraySet<E>        // backed by CopyOnWriteArrayList\nConcurrentLinkedQueue<E>      // lock-free thread-safe queue\nBlockingQueue<E>               // ArrayBlockingQueue, LinkedBlockingQueue\nConcurrentSkipListMap<K,V>    // sorted concurrent Map (like TreeMap)\nConcurrentSkipListSet<E>      // sorted concurrent Set\n```\n\n\ud83d\udccc Prefer java.util.concurrent classes. They use finer-grained locking (or lock-free CAS) for much better scalability than synchronized wrappers."}, {"q": "What are the utility methods in the Collections class?", "a": "java.util.Collections provides static utility methods for working with collections.\n\nSorting & Searching:\n```java\nCollections.sort(list);                         // natural sort\nCollections.sort(list, comparator);             // custom sort\nCollections.binarySearch(list, key);            // O(log n) search (list must be sorted)\nCollections.reverseOrder();                     // returns reverse Comparator\n```\n\nMin / Max:\n```java\nCollections.min(collection);\nCollections.max(collection, comparator);\n```\n\nModification:\n```java\nCollections.shuffle(list);                      // random order\nCollections.reverse(list);                     // reverse in place\nCollections.swap(list, i, j);                  // swap two elements\nCollections.fill(list, \"X\");                   // fill all with value\nCollections.copy(dest, src);                   // copy src into dest\nCollections.frequency(collection, obj);        // count occurrences\nCollections.disjoint(c1, c2);                  // true if no common elements\nCollections.nCopies(5, \"hello\");               // immutable list of 5 \"hello\"s\n```\n\nWrappers:\n```java\nCollections.unmodifiableList(list);            // read-only view\nCollections.synchronizedList(list);            // thread-safe wrapper\nCollections.singletonList(\"only\");             // immutable single-element list\nCollections.emptyList();                       // immutable empty list\n```"}, {"q": "What are immutable collections in Java? How do you create them?", "a": "Immutable collections cannot be modified after creation \u2014 add/remove/set throw UnsupportedOperationException.\n\nJava 9+ factory methods (recommended \u2014 most concise):\n```java\nList<String>        list = List.of(\"A\", \"B\", \"C\");\nSet<String>         set  = Set.of(\"X\", \"Y\", \"Z\");\nMap<String, Integer> map = Map.of(\"one\", 1, \"two\", 2);\nMap<String, Integer> bigMap = Map.ofEntries(\n    Map.entry(\"one\", 1),\n    Map.entry(\"two\", 2)\n);\n```\n\nPre-Java 9 alternatives:\n```java\n// Unmodifiable view (still mutable via original reference)\nList<String> unmod = Collections.unmodifiableList(new ArrayList<>(list));\n\n// Guava (external library)\nImmutableList<String> guava = ImmutableList.of(\"A\", \"B\", \"C\");\n```\n\nKey differences: List.of() vs Collections.unmodifiableList():\n\u2022 List.of() is truly immutable \u2014 no backdoor mutable reference.\n\u2022 Collections.unmodifiableList() wraps an existing list \u2014 the original can still be mutated.\n\u2022 List.of() does NOT allow null elements; unmodifiableList() does.\n\n\ud83d\udccc Prefer List.of() / Set.of() / Map.of() for constants and read-only data."}], "functional": [{"q": "What is a Functional Interface in Java?", "a": "A Functional Interface is an interface that has exactly ONE abstract method. It can have any number of default or static methods.\n\nAnnotated with @FunctionalInterface (optional but recommended \u2014 compiler enforces the single-abstract-method rule).\n\n```java\n@FunctionalInterface\ninterface Greeter {\n    String greet(String name);  // only one abstract method\n\n    default void printGreet(String name) {  // default allowed\n        System.out.println(greet(name));\n    }\n}\n\n// Use with lambda\nGreeter g = name -> \"Hello, \" + name + \"!\";\ng.printGreet(\"Alice\"); // Hello, Alice!\n```\n\n\ud83d\udccc Functional interfaces are the foundation of lambda expressions and the java.util.function package."}, {"q": "What are the four core built-in functional interfaces in Java?", "a": "Java 8 introduced java.util.function package with four fundamental interfaces:\n\n1. Predicate<T> \u2014 takes T, returns boolean\n```java\nPredicate<String> isEmpty = s -> s.isEmpty();\nisEmpty.test(\"\");       // true\nisEmpty.negate().test(\"\"); // false\n```\n\n2. Function<T, R> \u2014 takes T, returns R\n```java\nFunction<String, Integer> length = s -> s.length();\nlength.apply(\"hello\"); // 5\n```\n\n3. Consumer<T> \u2014 takes T, returns nothing (void)\n```java\nConsumer<String> print = s -> System.out.println(s);\nprint.accept(\"hello\"); // prints: hello\n```\n\n4. Supplier<T> \u2014 takes nothing, returns T\n```java\nSupplier<Double> random = () -> Math.random();\nrandom.get(); // 0.73241...\n```"}, {"q": "What is the difference between Function and BiFunction?", "a": "\u2022 Function<T, R>: Accepts ONE argument of type T, returns result of type R.\n\u2022 BiFunction<T, U, R>: Accepts TWO arguments (T and U), returns result of type R.\n\n```java\nFunction<String, Integer> strLen = s -> s.length();\nstrLen.apply(\"hello\"); // 5\n\nBiFunction<String, String, String> concat = (a, b) -> a + \" \" + b;\nconcat.apply(\"Hello\", \"World\"); // \"Hello World\"\n```\n\nChaining with andThen():\n```java\nFunction<Integer, Integer> doubleIt  = x -> x * 2;\nFunction<Integer, Integer> addThree  = x -> x + 3;\n\nFunction<Integer, Integer> doubleThenAdd = doubleIt.andThen(addThree);\ndoubleThenAdd.apply(5); // (5*2)+3 = 13\n```\n\n\ud83d\udccc Java only provides BiFunction (2 args). For 3+ args, define a custom functional interface."}, {"q": "What is UnaryOperator and BinaryOperator?", "a": "Special cases of Function where input and output types are the SAME.\n\n\u2022 UnaryOperator<T> extends Function<T, T> \u2014 one argument, same return type.\n\u2022 BinaryOperator<T> extends BiFunction<T, T, T> \u2014 two arguments, same return type.\n\n```java\nUnaryOperator<String> toUpper = s -> s.toUpperCase();\ntoUpper.apply(\"hello\"); // \"HELLO\"\n\nBinaryOperator<Integer> multiply = (a, b) -> a * b;\nmultiply.apply(4, 5); // 20\n\n// Common in reduce()\nList<Integer> nums = List.of(1, 2, 3, 4, 5);\nint product = nums.stream().reduce(1, (a, b) -> a * b); // 120\n```\n\n\ud83d\udccc Also available: IntUnaryOperator, LongBinaryOperator, etc. \u2014 primitive specializations to avoid boxing overhead."}, {"q": "How do Predicate combinators work? (and, or, negate)", "a": "Predicate provides default methods to compose complex conditions without nested if-statements.\n\n```java\nPredicate<Integer> isPositive  = n -> n > 0;\nPredicate<Integer> isEven      = n -> n % 2 == 0;\nPredicate<Integer> lessThan100 = n -> n < 100;\n\n// AND \u2014 both must be true\nPredicate<Integer> positiveAndEven = isPositive.and(isEven);\npositiveAndEven.test(4);   // true\npositiveAndEven.test(-4);  // false\n\n// OR \u2014 at least one must be true\nPredicate<Integer> positiveOrEven = isPositive.or(isEven);\npositiveOrEven.test(-4);   // true (even)\n\n// NEGATE \u2014 flip the result\nPredicate<Integer> isOdd = isEven.negate();\nisOdd.test(3); // true\n\n// Chain all\nPredicate<Integer> valid = isPositive.and(isEven).and(lessThan100);\nList.of(2, 50, -4, 102).stream()\n    .filter(valid)\n    .collect(Collectors.toList()); // [2, 50]\n```"}, {"q": "What is the difference between Consumer and BiConsumer?", "a": "\u2022 Consumer<T>: Accepts one argument, returns nothing. Used for side effects.\n\u2022 BiConsumer<T, U>: Accepts two arguments, returns nothing.\n\n```java\nConsumer<String> log = msg -> System.out.println(\"[LOG] \" + msg);\nlog.accept(\"Server started\"); // [LOG] Server started\n\n// andThen() \u2014 chain consumers\nConsumer<String> log2 = msg -> System.out.println(\"[AUDIT] \" + msg);\nConsumer<String> combined = log.andThen(log2);\ncombined.accept(\"Login\"); // prints both log lines\n\n// BiConsumer\nBiConsumer<String, Integer> printWithIndex =\n    (s, i) -> System.out.println(i + \": \" + s);\nprintWithIndex.accept(\"Apple\", 1); // 1: Apple\n```\n\nReal-world usage:\n\u2022 forEach() takes a Consumer: list.forEach(System.out::println)\n\u2022 Map.forEach() takes a BiConsumer: map.forEach((k, v) -> ...)\n"}, {"q": "What are primitive specializations of functional interfaces and why do they exist?", "a": "Generics in Java use object types, so Function<Integer, Integer> causes autoboxing (int \u2192 Integer), which is wasteful.\n\nJava provides primitive-specialized versions to avoid boxing overhead:\n\nFor int:\n\u2022 IntFunction<R>    \u2014 int \u2192 R\n\u2022 ToIntFunction<T>  \u2014 T \u2192 int\n\u2022 IntConsumer       \u2014 int \u2192 void\n\u2022 IntSupplier       \u2014 () \u2192 int\n\u2022 IntPredicate      \u2014 int \u2192 boolean\n\u2022 IntUnaryOperator  \u2014 int \u2192 int\n\u2022 IntBinaryOperator \u2014 (int, int) \u2192 int\n\nSimilarly for long and double.\n\n```java\n// Inefficient \u2014 boxes int to Integer\nFunction<Integer, Integer> square = x -> x * x;\n\n// Efficient \u2014 no boxing\nIntUnaryOperator square = x -> x * x;\nsquare.applyAsInt(5); // 25\n\n// In streams\nIntStream.range(1, 6)\n         .map(x -> x * x)   // IntUnaryOperator\n         .sum();             // 55\n```"}, {"q": "What is Function composition? Explain compose() vs andThen().", "a": "Both methods combine two Functions into one, but in different ORDER.\n\n\u2022 f.andThen(g) \u2014 applies f FIRST, then g. Result: g(f(x))\n\u2022 f.compose(g) \u2014 applies g FIRST, then f. Result: f(g(x))\n\n```java\nFunction<Integer, Integer> times2 = x -> x * 2;\nFunction<Integer, Integer> plus10 = x -> x + 10;\n\n// andThen: times2 first, then plus10\ntimes2.andThen(plus10).apply(5);  // (5*2)+10 = 20\n\n// compose: plus10 first, then times2\ntimes2.compose(plus10).apply(5);  // (5+10)*2 = 30\n```\n\nPractical use \u2014 building a pipeline:\n```java\nFunction<String, String> trim     = String::trim;\nFunction<String, String> toLower  = String::toLowerCase;\nFunction<String, Integer> length  = String::length;\n\nFunction<String, Integer> pipeline = trim.andThen(toLower).andThen(length);\npipeline.apply(\"  Hello World  \"); // 11\n```"}, {"q": "How do method references relate to functional interfaces?", "a": "Method references are shorthand for lambdas that simply call an existing method. They work wherever a functional interface is expected.\n\n4 types of method references:\n\n1. Static method: ClassName::staticMethod\n```java\nFunction<String, Integer> parse = Integer::parseInt;\nparse.apply(\"42\"); // 42\n```\n\n2. Instance method on a specific object: instance::method\n```java\nString prefix = \"Hello\";\nPredicate<String> startsWith = prefix::equals;\n```\n\n3. Instance method on an arbitrary object of a type: ClassName::method\n```java\nFunction<String, String> upper = String::toUpperCase;\nupper.apply(\"hello\"); // \"HELLO\"\n```\n\n4. Constructor: ClassName::new\n```java\nSupplier<ArrayList<String>> listFactory = ArrayList::new;\nArrayList<String> list = listFactory.get();\n```"}, {"q": "How would you write a custom functional interface? When is it needed?", "a": "Write a custom functional interface when the built-in ones don't fit your signature.\n\n```java\n@FunctionalInterface\ninterface TriFunction<A, B, C, R> {\n    R apply(A a, B b, C c);\n}\n\nTriFunction<Integer, Integer, Integer, Integer> sum =\n    (a, b, c) -> a + b + c;\nsum.apply(1, 2, 3); // 6\n```\n\n```java\n// Custom with checked exception\n@FunctionalInterface\ninterface ThrowingSupplier<T> {\n    T get() throws Exception;\n}\n\nThrowingSupplier<String> readFile = () -> Files.readString(Path.of(\"data.txt\"));\n```\n\nWhen to create custom FIs:\n\u2022 Need more than 2 parameters (no TriFunction built-in).\n\u2022 Need to throw checked exceptions.\n\u2022 Need domain-specific naming for clarity (e.g., Validator<T> instead of Predicate<T>)."}, {"q": "How are functional interfaces used in Streams?", "a": "Every Stream operation takes a functional interface:\n\n```java\nList<String> names = List.of(\"Alice\", \"Bob\", \"Charlie\", \"Anna\");\n\nList<String> result = names.stream()\n    .filter(s -> s.startsWith(\"A\"))   // Predicate<String>\n    .map(String::toUpperCase)          // Function<String, String>\n    .sorted()                          // Comparator<String> (BiFunction)\n    .peek(System.out::println)         // Consumer<String>\n    .collect(Collectors.toList());     // Collector (terminal)\n\n// reduce uses BinaryOperator\nOptional<String> longest = names.stream()\n    .reduce((a, b) -> a.length() >= b.length() ? a : b);\nlongest.ifPresent(System.out::println); // \"Charlie\"\n```\n\nStream operation \u2192 Functional Interface mapping:\n\u2022 filter()   \u2192 Predicate<T>\n\u2022 map()      \u2192 Function<T, R>\n\u2022 forEach()  \u2192 Consumer<T>\n\u2022 sorted()   \u2192 Comparator<T>\n\u2022 reduce()   \u2192 BinaryOperator<T>\n\u2022 flatMap()  \u2192 Function<T, Stream<R>>\n\u2022 anyMatch() \u2192 Predicate<T>"}, {"q": "What is the Comparator functional interface and how do you use it?", "a": "Comparator<T> is a functional interface with compare(T o1, T o2) as its abstract method. It's widely used for sorting.\n\n```java\nList<String> names = Arrays.asList(\"Charlie\", \"Alice\", \"Bob\");\n\n// Lambda\nnames.sort((a, b) -> a.compareTo(b));\n\n// Method reference\nnames.sort(String::compareTo);\n\n// Comparator.comparing() \u2014 cleaner\nnames.sort(Comparator.comparing(String::length));\n\n// Chained comparators \u2014 sort by length, then alphabetically\nnames.sort(Comparator.comparing(String::length)\n           .thenComparing(Comparator.naturalOrder()));\n\n// Reversed\nnames.sort(Comparator.comparing(String::length).reversed());\n```\n\nSorting objects:\n```java\nList<Employee> emps = ...;\nemps.sort(Comparator.comparing(Employee::getDept)\n          .thenComparing(Employee::getSalary).reversed());\n```"}, {"q": "What is the Runnable and Callable functional interface? How do they differ?", "a": "Both represent tasks, but with key differences:\n\n\u2022 Runnable: No return value, cannot throw checked exceptions.\n\u2022 Callable<V>: Returns a value of type V, can throw checked exceptions.\n\n```java\n// Runnable\nRunnable r = () -> System.out.println(\"Running in thread\");\nnew Thread(r).start();\n\n// Callable \u2014 used with ExecutorService\nCallable<Integer> task = () -> {\n    Thread.sleep(1000);\n    return 42;\n};\n\nExecutorService executor = Executors.newSingleThreadExecutor();\nFuture<Integer> future = executor.submit(task);\nInteger result = future.get(); // blocks until done \u2192 42\n```\n\n\ud83d\udccc Callable is preferred when you need results or need to propagate exceptions from async tasks. CompletableFuture is the modern replacement for Future."}], "streams": [{"q": "What is the Java Stream API and how does it differ from Collections?", "a": "The Stream API (Java 8) provides a declarative, functional-style pipeline for processing sequences of elements.\n\nKey differences from Collections:\n\nFeature          | Collection              | Stream\n-----------------|-------------------------|-------------------------\nStorage          | Stores elements         | Does not store elements\nConsumption      | Reusable                | Single-use (consumed once)\nModification     | Can add/remove          | Does not modify source\nEvaluation       | Eager                   | Lazy (computed on demand)\nIteration        | External (for loop)     | Internal (handled by API)\nParallel         | Manual                  | parallelStream() built-in\n\n```java\nList<String> names = List.of(\"Alice\", \"Bob\", \"Charlie\", \"Anna\");\n\n// Collection \u2014 external iteration\nfor (String n : names) { if (n.startsWith(\"A\")) System.out.println(n); }\n\n// Stream \u2014 internal, declarative\nnames.stream()\n     .filter(n -> n.startsWith(\"A\"))\n     .forEach(System.out::println);\n```"}, {"q": "What is the difference between intermediate and terminal operations?", "a": "Intermediate Operations:\n\u2022 Return a new Stream \u2014 they are LAZY (not executed until a terminal op is called).\n\u2022 Can be chained indefinitely.\n\u2022 Examples: filter(), map(), flatMap(), sorted(), distinct(), limit(), skip(), peek(), mapToInt()\n\nTerminal Operations:\n\u2022 Consume the stream and produce a result or side effect.\n\u2022 Trigger execution of the entire pipeline.\n\u2022 The stream cannot be reused after a terminal op.\n\u2022 Examples: collect(), forEach(), reduce(), count(), findFirst(), findAny(), anyMatch(), allMatch(), noneMatch(), min(), max(), toArray()\n\n```java\nList<Integer> result = Stream.of(5, 3, 1, 4, 2)\n    .filter(n -> n > 1)      // intermediate \u2014 lazy\n    .map(n -> n * 10)        // intermediate \u2014 lazy\n    .sorted()                // intermediate \u2014 lazy\n    .collect(Collectors.toList()); // terminal \u2014 triggers pipeline\n// [20, 30, 40, 50]\n```\n\n\ud83d\udccc Nothing happens until a terminal operation is called. This laziness enables short-circuiting optimizations."}, {"q": "Explain filter(), map(), and flatMap() with examples.", "a": "filter(Predicate<T>) \u2014 keeps elements matching the predicate:\n```java\nList<Integer> evens = Stream.of(1,2,3,4,5,6)\n    .filter(n -> n % 2 == 0)\n    .collect(Collectors.toList()); // [2, 4, 6]\n```\n\nmap(Function<T,R>) \u2014 transforms each element to a new type:\n```java\nList<String> names = List.of(\"alice\", \"bob\", \"charlie\");\nList<String> upper = names.stream()\n    .map(String::toUpperCase)\n    .collect(Collectors.toList()); // [ALICE, BOB, CHARLIE]\n```\n\nflatMap(Function<T, Stream<R>>) \u2014 flattens nested streams into one:\n```java\nList<List<Integer>> nested = List.of(List.of(1,2), List.of(3,4), List.of(5));\nList<Integer> flat = nested.stream()\n    .flatMap(Collection::stream)\n    .collect(Collectors.toList()); // [1, 2, 3, 4, 5]\n\n// Common use: split sentences into words\nList<String> sentences = List.of(\"hello world\", \"java streams\");\nList<String> words = sentences.stream()\n    .flatMap(s -> Arrays.stream(s.split(\" \")))\n    .collect(Collectors.toList()); // [hello, world, java, streams]\n```"}, {"q": "How does reduce() work in Streams?", "a": "reduce() combines all stream elements into a single result using an accumulator function.\n\nThree overloads:\n\n1. reduce(identity, BinaryOperator) \u2014 always returns T:\n```java\nint sum = Stream.of(1, 2, 3, 4, 5)\n    .reduce(0, Integer::sum); // 15\n\nint product = Stream.of(1, 2, 3, 4, 5)\n    .reduce(1, (a, b) -> a * b); // 120\n```\n\n2. reduce(BinaryOperator) \u2014 returns Optional<T> (stream may be empty):\n```java\nOptional<String> longest = Stream.of(\"hi\", \"hello\", \"hey\")\n    .reduce((a, b) -> a.length() >= b.length() ? a : b);\nlongest.ifPresent(System.out::println); // \"hello\"\n```\n\n3. reduce(identity, BiFunction, BinaryOperator) \u2014 for parallel/type-changing reduce:\n```java\n// Sum lengths of strings\nint totalLen = Stream.of(\"hi\", \"hello\", \"hey\")\n    .reduce(0, (acc, s) -> acc + s.length(), Integer::sum); // 10\n```\n\n\ud83d\udccc Use collect() over reduce() when building mutable containers (lists, maps) \u2014 it's more efficient."}, {"q": "What is the collect() method and how do Collectors work?", "a": "collect() is a terminal operation that accumulates stream elements into a mutable container (List, Set, Map, String, etc.) using a Collector.\n\nCommon Collectors:\n```java\n// To List / Set / unmodifiable\nList<String> list = stream.collect(Collectors.toList());\nSet<String>  set  = stream.collect(Collectors.toSet());\nList<String> unmod = stream.collect(Collectors.toUnmodifiableList());\n\n// Joining strings\nString csv = Stream.of(\"a\",\"b\",\"c\")\n    .collect(Collectors.joining(\", \", \"[\", \"]\")); // [a, b, c]\n\n// Counting\nlong count = stream.collect(Collectors.counting());\n\n// Grouping\nMap<Integer, List<String>> byLength = Stream.of(\"hi\",\"hello\",\"hey\",\"world\")\n    .collect(Collectors.groupingBy(String::length));\n// {2=[hi], 3=[hey], 5=[hello, world]}\n\n// Partitioning (split into true/false groups)\nMap<Boolean, List<Integer>> parts = Stream.of(1,2,3,4,5)\n    .collect(Collectors.partitioningBy(n -> n % 2 == 0));\n// {false=[1,3,5], true=[2,4]}\n\n// Mapping downstream\nMap<Integer, Long> countByLength = Stream.of(\"hi\",\"hello\",\"hey\",\"world\")\n    .collect(Collectors.groupingBy(String::length, Collectors.counting()));\n// {2=1, 3=1, 5=2}\n```"}, {"q": "What is the difference between findFirst() and findAny()?", "a": "Both return an Optional<T> with a matching element, but behave differently in parallel streams.\n\nfindFirst():\n\u2022 Returns the FIRST element in encounter order.\n\u2022 Deterministic \u2014 same result every time.\n\u2022 Slower in parallel (must coordinate to find the first).\n\nfindAny():\n\u2022 Returns ANY element \u2014 no order guarantee.\n\u2022 Non-deterministic in parallel (returns whichever thread finds one first).\n\u2022 Faster in parallel streams.\n\n```java\nList<String> names = List.of(\"Alice\", \"Bob\", \"Anna\", \"Charlie\");\n\n// Sequential \u2014 both return same result\nnames.stream().filter(n -> n.startsWith(\"A\")).findFirst(); // Optional[Alice]\nnames.stream().filter(n -> n.startsWith(\"A\")).findAny();   // Optional[Alice]\n\n// Parallel \u2014 findAny may return Alice or Anna\nnames.parallelStream().filter(n -> n.startsWith(\"A\")).findFirst(); // Optional[Alice]\nnames.parallelStream().filter(n -> n.startsWith(\"A\")).findAny();   // Optional[Alice or Anna]\n```\n\n\ud83d\udccc Use findFirst() when order matters. Use findAny() in parallel streams for better performance."}, {"q": "What is the difference between anyMatch(), allMatch(), and noneMatch()?", "a": "All three are short-circuiting terminal operations that return boolean.\n\nanyMatch(predicate) \u2014 true if AT LEAST ONE element matches:\n```java\nList.of(1,2,3,4,5).stream().anyMatch(n -> n > 4);  // true (5 > 4)\nList.of(1,2,3).stream().anyMatch(n -> n > 10);      // false\n```\n\nallMatch(predicate) \u2014 true if ALL elements match:\n```java\nList.of(2,4,6,8).stream().allMatch(n -> n % 2 == 0); // true\nList.of(2,3,6,8).stream().allMatch(n -> n % 2 == 0); // false (3 is odd)\n```\n\nnoneMatch(predicate) \u2014 true if NO elements match:\n```java\nList.of(1,3,5,7).stream().noneMatch(n -> n % 2 == 0); // true (no evens)\nList.of(1,2,5,7).stream().noneMatch(n -> n % 2 == 0); // false (2 is even)\n```\n\nShort-circuiting behavior:\n\u2022 anyMatch stops at the first true.\n\u2022 allMatch stops at the first false.\n\u2022 noneMatch stops at the first true.\n\nOn empty streams: anyMatch \u2192 false, allMatch \u2192 true, noneMatch \u2192 true."}, {"q": "How do sorted(), distinct(), limit(), and skip() work?", "a": "sorted() \u2014 sorts elements (natural order or custom Comparator):\n```java\nStream.of(3,1,4,1,5,9).sorted().collect(toList());             // [1,1,3,4,5,9]\nStream.of(\"banana\",\"apple\",\"cherry\").sorted().collect(toList()); // alphabetical\nStream.of(3,1,4).sorted(Comparator.reverseOrder()).collect(toList()); // [4,3,1]\n```\n\ndistinct() \u2014 removes duplicates (uses equals/hashCode):\n```java\nStream.of(1,2,2,3,3,3,4).distinct().collect(toList()); // [1,2,3,4]\n```\n\nlimit(n) \u2014 truncates stream to first n elements (short-circuits):\n```java\nStream.iterate(0, n -> n + 1).limit(5).collect(toList()); // [0,1,2,3,4]\n```\n\nskip(n) \u2014 skips first n elements:\n```java\nStream.of(1,2,3,4,5).skip(2).collect(toList()); // [3,4,5]\n```\n\nPagination pattern using skip + limit:\n```java\nint page = 2, pageSize = 10;\nlist.stream()\n    .skip((long)(page - 1) * pageSize)\n    .limit(pageSize)\n    .collect(toList());\n```"}, {"q": "What are primitive Streams (IntStream, LongStream, DoubleStream)?", "a": "Primitive streams avoid boxing overhead by working directly with primitives.\n\nCreating primitive streams:\n```java\nIntStream.of(1, 2, 3, 4, 5);\nIntStream.range(1, 6);       // 1,2,3,4,5 (exclusive end)\nIntStream.rangeClosed(1, 5); // 1,2,3,4,5 (inclusive end)\nLongStream.range(0L, 1_000_000L);\nDoubleStream.of(1.1, 2.2, 3.3);\n```\n\nUseful terminal operations (not available on Stream<T>):\n```java\nIntStream nums = IntStream.rangeClosed(1, 10);\nnums.sum();     // 55\nnums.average(); // OptionalDouble[5.5]\nnums.min();     // OptionalInt[1]\nnums.max();     // OptionalInt[10]\nnums.summaryStatistics(); // count, sum, min, max, average\n```\n\nMapping between object and primitive streams:\n```java\n// Object \u2192 primitive\nStream.of(\"hi\",\"hello\",\"hey\").mapToInt(String::length); // IntStream [2,5,3]\n\n// Primitive \u2192 object\nIntStream.of(1,2,3).boxed();           // Stream<Integer>\nIntStream.of(1,2,3).mapToObj(n -> \"item-\" + n); // Stream<String>\n```"}, {"q": "What is the difference between map() and mapToInt() / mapToObj()?", "a": "map(Function<T,R>) \u2014 transforms Stream<T> to Stream<R> (always object stream):\n```java\nStream<String> names = Stream.of(\"Alice\", \"Bob\");\nStream<Integer> lengths = names.map(String::length); // Stream<Integer> \u2014 boxed!\n```\n\nmapToInt(ToIntFunction<T>) \u2014 transforms Stream<T> to IntStream (no boxing):\n```java\nStream<String> names = Stream.of(\"Alice\", \"Bob\");\nIntStream lengths = names.mapToInt(String::length); // IntStream \u2014 primitive, efficient\nint total = lengths.sum(); // 8\n```\n\nmapToObj(IntFunction<R>) \u2014 transforms IntStream back to Stream<R>:\n```java\nIntStream.range(1, 4).mapToObj(n -> \"item-\" + n); // Stream<String>\n```\n\nmapToLong() / mapToDouble() \u2014 same pattern for long/double.\n\nflatMapToInt() \u2014 like flatMap but returns IntStream:\n```java\nStream.of(\"1 2 3\", \"4 5\")\n    .flatMapToInt(s -> Arrays.stream(s.split(\" \")).mapToInt(Integer::parseInt))\n    .sum(); // 15\n```\n\n\ud83d\udccc Prefer mapToInt/mapToLong/mapToDouble when doing numeric aggregations \u2014 avoids autoboxing and enables sum(), average(), summaryStatistics()."}, {"q": "How does Stream.peek() work and when should you use it?", "a": "peek(Consumer<T>) is an intermediate operation that performs a side effect on each element WITHOUT consuming or modifying the stream.\n\nPrimary use: debugging pipelines.\n```java\nList<String> result = Stream.of(\"alice\", \"bob\", \"charlie\")\n    .peek(s -> System.out.println(\"Before filter: \" + s))\n    .filter(s -> s.length() > 3)\n    .peek(s -> System.out.println(\"After filter:  \" + s))\n    .map(String::toUpperCase)\n    .peek(s -> System.out.println(\"After map:     \" + s))\n    .collect(Collectors.toList());\n\n// Output:\n// Before filter: alice\n// After filter:  alice\n// After map:     ALICE\n// Before filter: bob\n// Before filter: charlie\n// After filter:  charlie\n// After map:     CHARLIE\n```\n\n\u26a0\ufe0f Caveats:\n\u2022 peek() is lazy \u2014 it only runs when the terminal operation triggers the pipeline.\n\u2022 Do NOT use peek() for modifying state or as a substitute for forEach() \u2014 this is an anti-pattern.\n\u2022 peek() may be optimized away by the JVM in certain cases.\n\u2022 In parallel streams, peek() is not guaranteed to run in any particular order."}, {"q": "What is a parallel Stream and how does it work?", "a": "Parallel streams split the data source into chunks, process them concurrently using the ForkJoinPool.commonPool(), then combine results.\n\nCreating a parallel stream:\n```java\nList<Integer> nums = List.of(1,2,3,4,5,6,7,8);\n\n// From collection\nnums.parallelStream()\n    .map(n -> n * 2)\n    .collect(Collectors.toList());\n\n// Convert existing stream\nnums.stream().parallel().filter(n -> n > 3).collect(Collectors.toList());\n```\n\nWhen parallel streams HELP:\n\u2022 Large data sets (thousands+ elements).\n\u2022 CPU-intensive operations (sorting, hashing, complex math).\n\u2022 Operations that are truly independent (no shared state).\n\nWhen parallel streams HURT:\n\u2022 Small collections \u2014 thread overhead outweighs benefit.\n\u2022 I/O-bound tasks \u2014 threads block, no speedup.\n\u2022 Stateful/order-dependent operations (sorted(), distinct() \u2014 require coordination).\n\u2022 Shared mutable state \u2014 leads to race conditions.\n\n```java\n// WRONG \u2014 race condition!\nList<Integer> result = new ArrayList<>();\nStream.of(1,2,3,4,5).parallel().forEach(result::add); // not thread-safe\n\n// CORRECT \u2014 use thread-safe collector\nList<Integer> result = Stream.of(1,2,3,4,5)\n    .parallel()\n    .collect(Collectors.toList()); // safe\n```"}, {"q": "What is Stream.generate() and Stream.iterate()?", "a": "Both create INFINITE streams. Always pair with limit() or a predicate to avoid infinite loops.\n\nStream.generate(Supplier<T>) \u2014 produces an infinite stream of values from a Supplier:\n```java\n// Infinite random numbers\nStream.generate(Math::random).limit(5).forEach(System.out::println);\n\n// Infinite constants\nStream.generate(() -> \"hello\").limit(3).collect(toList()); // [hello, hello, hello]\n\n// Infinite UUIDs\nStream.generate(UUID::randomUUID).limit(3).forEach(System.out::println);\n```\n\nStream.iterate(seed, UnaryOperator) \u2014 produces an infinite stream from a seed + step function:\n```java\n// 0, 2, 4, 6, 8\nStream.iterate(0, n -> n + 2).limit(5).collect(toList());\n\n// Fibonacci sequence\nStream.iterate(new int[]{0,1}, f -> new int[]{f[1], f[0]+f[1]})\n      .limit(8).map(f -> f[0]).collect(toList()); // [0,1,1,2,3,5,8,13]\n```\n\nStream.iterate(seed, predicate, next) \u2014 finite version (Java 9+):\n```java\n// Powers of 2 less than 100\nStream.iterate(1, n -> n < 100, n -> n * 2)\n      .collect(toList()); // [1, 2, 4, 8, 16, 32, 64]\n```"}, {"q": "How do you group and partition data using Collectors?", "a": "groupingBy \u2014 groups elements by a classifier function into a Map<K, List<V>>:\n```java\nList<String> words = List.of(\"hi\",\"hello\",\"hey\",\"world\",\"wow\");\n\n// Basic grouping\nMap<Integer, List<String>> byLen = words.stream()\n    .collect(Collectors.groupingBy(String::length));\n// {2=[hi], 3=[hey, wow], 5=[hello, world]}\n\n// Downstream collector \u2014 count per group\nMap<Integer, Long> countByLen = words.stream()\n    .collect(Collectors.groupingBy(String::length, Collectors.counting()));\n// {2=1, 3=2, 5=2}\n\n// Downstream \u2014 map values\nMap<Integer, List<String>> upperByLen = words.stream()\n    .collect(Collectors.groupingBy(String::length,\n        Collectors.mapping(String::toUpperCase, Collectors.toList())));\n\n// Multi-level grouping\nMap<Department, Map<Role, List<Employee>>> grouped = employees.stream()\n    .collect(Collectors.groupingBy(Employee::getDept,\n        Collectors.groupingBy(Employee::getRole)));\n```\n\npartitioningBy \u2014 splits into exactly two groups (true/false):\n```java\nMap<Boolean, List<Integer>> evenOdd = Stream.of(1,2,3,4,5)\n    .collect(Collectors.partitioningBy(n -> n % 2 == 0));\n// {false=[1,3,5], true=[2,4]}\n\n// With downstream\nMap<Boolean, Long> countEvenOdd = Stream.of(1,2,3,4,5)\n    .collect(Collectors.partitioningBy(n -> n % 2 == 0, Collectors.counting()));\n// {false=3, true=2}\n```"}, {"q": "What are common Stream pitfalls and best practices?", "a": "Pitfall 1 \u2014 Reusing a consumed stream (throws IllegalStateException):\n```java\nStream<String> s = Stream.of(\"a\",\"b\",\"c\");\ns.forEach(System.out::println);\ns.count(); // IllegalStateException: stream has already been operated upon\n```\n\nPitfall 2 \u2014 Modifying the source during stream processing:\n```java\nList<String> list = new ArrayList<>(List.of(\"a\",\"b\",\"c\"));\nlist.stream().forEach(e -> list.remove(e)); // ConcurrentModificationException\n```\n\nPitfall 3 \u2014 Using parallel streams with shared mutable state:\n```java\n// WRONG\nint[] count = {0};\nStream.of(1,2,3).parallel().forEach(n -> count[0]++); // race condition\n\n// RIGHT \u2014 use thread-safe aggregation\nlong count = Stream.of(1,2,3).parallel().count();\n```\n\nPitfall 4 \u2014 Stateful lambdas in parallel streams:\n```java\n// WRONG \u2014 sorted() in parallel requires buffering all elements\nhugeStream.parallel().sorted().findFirst(); // defeats parallelism\n```\n\nBest practices:\n\u2022 Prefer method references over verbose lambdas for readability.\n\u2022 Use primitive streams (IntStream) for numeric work to avoid boxing.\n\u2022 Don't overuse parallel() \u2014 benchmark before switching.\n\u2022 Keep stream pipelines short and readable \u2014 extract complex lambdas to named methods.\n\u2022 Use collect(toUnmodifiableList()) for immutable results."}], "datetime": [{"q": "Why was the new Date/Time API introduced in Java 8? What was wrong with the old API?", "a": "Problems with the legacy API (java.util.Date, java.util.Calendar):\n\n\u2022 java.util.Date is mutable \u2014 leads to thread-safety issues.\n\u2022 Months in Calendar are 0-indexed (January = 0, December = 11) \u2014 a constant source of bugs.\n\u2022 Date represents both a date AND a time \u2014 no separation of concerns.\n\u2022 No timezone support built cleanly into Date.\n\u2022 Poor API design \u2014 Date.getYear() returns years since 1900.\n\u2022 No concept of durations, periods, or time zones in a clean way.\n\u2022 Third-party libraries like Joda-Time were widely used to fill the gap.\n\nJava 8 introduced java.time (JSR-310), inspired by Joda-Time:\n\u2022 Immutable and thread-safe \u2014 all objects are value-based.\n\u2022 Clear separation: LocalDate (date only), LocalTime (time only), LocalDateTime (both), ZonedDateTime (with timezone).\n\u2022 Human-friendly API \u2014 months are 1-indexed (January = 1).\n\u2022 Rich support for durations, periods, formatting, parsing, and timezone handling.\n\u2022 Fluent, readable method chaining."}, {"q": "What are the core classes in the java.time package?", "a": "java.time core classes and their purposes:\n\nDate/Time classes:\n```\nLocalDate        \u2014 date only (year, month, day). No time, no timezone.\nLocalTime        \u2014 time only (hour, minute, second, nanosecond). No date.\nLocalDateTime    \u2014 date + time. No timezone.\nZonedDateTime    \u2014 date + time + timezone (full instant with zone rules).\nOffsetDateTime   \u2014 date + time + UTC offset (e.g. +05:30). No DST rules.\nOffsetTime       \u2014 time + UTC offset.\nInstant          \u2014 a point on the UTC timeline (machine timestamp, epoch-based).\n```\n\nDuration/Period:\n```\nDuration         \u2014 amount of time in seconds/nanoseconds (time-based).\nPeriod           \u2014 amount of time in years/months/days (date-based).\n```\n\nSupporting classes:\n```\nZoneId           \u2014 timezone identifier (e.g. \"Asia/Kolkata\", \"America/New_York\").\nZoneOffset       \u2014 fixed UTC offset (e.g. +05:30).\nMonth            \u2014 enum for months (JANUARY to DECEMBER).\nDayOfWeek        \u2014 enum (MONDAY to SUNDAY).\nDateTimeFormatter \u2014 formatting and parsing.\nClock            \u2014 testable time source (useful for unit tests).\n```"}, {"q": "How do you create and use LocalDate, LocalTime, and LocalDateTime?", "a": "LocalDate \u2014 date only:\n```java\nLocalDate today    = LocalDate.now();\nLocalDate birthday = LocalDate.of(1995, Month.JUNE, 15);\nLocalDate parsed   = LocalDate.parse(\"2024-06-15\");\n\ntoday.getYear();        // 2024\ntoday.getMonth();       // JUNE\ntoday.getDayOfMonth();  // 15\ntoday.getDayOfWeek();   // FRIDAY\ntoday.isLeapYear();     // false\n\n// Arithmetic \u2014 all methods return new instances (immutable)\ntoday.plusDays(10);\ntoday.minusMonths(2);\ntoday.withYear(2025);\ntoday.with(TemporalAdjusters.firstDayOfMonth());\n```\n\nLocalTime \u2014 time only:\n```java\nLocalTime now  = LocalTime.now();\nLocalTime time = LocalTime.of(14, 30, 0); // 14:30:00\nLocalTime parsed = LocalTime.parse(\"14:30:00\");\n\ntime.getHour();    // 14\ntime.getMinute();  // 30\ntime.plusHours(2); // 16:30:00\n```\n\nLocalDateTime \u2014 date + time:\n```java\nLocalDateTime dt = LocalDateTime.now();\nLocalDateTime dt2 = LocalDateTime.of(2024, 6, 15, 14, 30);\n\ndt.toLocalDate();  // extract LocalDate\ndt.toLocalTime();  // extract LocalTime\ndt.plusDays(1).minusHours(3);\n```"}, {"q": "What is the difference between LocalDateTime, ZonedDateTime, OffsetDateTime, and Instant?", "a": "LocalDateTime:\n\u2022 Date + time with NO timezone info.\n\u2022 Use for: calendars, scheduling, birthdays \u2014 anything timezone-agnostic.\n\u2022 Cannot be converted to an Instant without a timezone.\n```java\nLocalDateTime ldt = LocalDateTime.of(2024, 6, 15, 10, 0);\n```\n\nInstant:\n\u2022 A point on the UTC timeline (epoch-based, nanosecond precision).\n\u2022 Use for: timestamps, logging, measuring elapsed time, database storage.\n```java\nInstant now = Instant.now(); // 2024-06-15T04:30:00.000Z\n```\n\nZonedDateTime:\n\u2022 Date + time + full timezone (with DST rules).\n\u2022 Use for: scheduling across timezones, user-facing times.\n```java\nZonedDateTime zdt = ZonedDateTime.now(ZoneId.of(\"America/New_York\"));\nZonedDateTime zdt2 = ldt.atZone(ZoneId.of(\"Asia/Kolkata\"));\n```\n\nOffsetDateTime:\n\u2022 Date + time + fixed UTC offset (no DST rules).\n\u2022 Use for: APIs, JSON/XML timestamps (ISO-8601 format), database columns.\n```java\nOffsetDateTime odt = OffsetDateTime.now(ZoneOffset.of(\"+05:30\"));\n```\n\nConversion chain:\n```java\nLocalDateTime \u2192 ZonedDateTime \u2192 Instant\nldt.atZone(ZoneId.of(\"UTC\")).toInstant()\nInstant.now().atZone(ZoneId.of(\"Asia/Kolkata\")).toLocalDateTime()\n```"}, {"q": "How do you format and parse dates using DateTimeFormatter?", "a": "DateTimeFormatter is thread-safe and immutable (unlike the old SimpleDateFormat).\n\nPredefined formatters:\n```java\nLocalDate date = LocalDate.of(2024, 6, 15);\n\nDateTimeFormatter.ISO_LOCAL_DATE.format(date);      // \"2024-06-15\"\nDateTimeFormatter.ISO_LOCAL_DATE_TIME.format(\n    LocalDateTime.of(2024,6,15,10,30));              // \"2024-06-15T10:30:00\"\nDateTimeFormatter.ISO_ZONED_DATE_TIME.format(\n    ZonedDateTime.now());                            // \"2024-06-15T10:30:00+05:30[Asia/Kolkata]\"\n```\n\nCustom patterns:\n```java\nDateTimeFormatter fmt = DateTimeFormatter.ofPattern(\"dd/MM/yyyy HH:mm:ss\");\n\n// Formatting\nLocalDateTime dt = LocalDateTime.of(2024, 6, 15, 14, 30, 0);\nString formatted = dt.format(fmt); // \"15/06/2024 14:30:00\"\n\n// Parsing\nLocalDateTime parsed = LocalDateTime.parse(\"15/06/2024 14:30:00\", fmt);\n```\n\nLocalized formatting:\n```java\nDateTimeFormatter localized = DateTimeFormatter\n    .ofLocalizedDate(FormatStyle.LONG)\n    .withLocale(Locale.US);\nLocalDate.now().format(localized); // \"June 15, 2024\"\n```\n\n\ud83d\udccc Common pattern symbols:\n\u2022 yyyy/MM/dd \u2014 year/month/day\n\u2022 HH:mm:ss \u2014 24-hour hour:minute:second\n\u2022 hh:mm a \u2014 12-hour with AM/PM\n\u2022 Z or XXX \u2014 timezone offset\n\u2022 z \u2014 timezone name"}, {"q": "How do you work with timezones using ZoneId and ZoneOffset?", "a": "ZoneId \u2014 represents a full timezone with DST rules:\n```java\n// Get available zone IDs\nZoneId.getAvailableZoneIds(); // \"Asia/Kolkata\", \"America/New_York\", etc.\n\nZoneId kolkata  = ZoneId.of(\"Asia/Kolkata\");\nZoneId ny       = ZoneId.of(\"America/New_York\");\nZoneId utc      = ZoneId.of(\"UTC\");\nZoneId system   = ZoneId.systemDefault();\n\n// Convert a time between timezones\nZonedDateTime indiaTime = ZonedDateTime.of(2024, 6, 15, 10, 0, 0, 0, kolkata);\nZonedDateTime nyTime    = indiaTime.withZoneSameInstant(ny);\nSystem.out.println(nyTime); // 2024-06-15T00:30-04:00[America/New_York]\n```\n\nZoneOffset \u2014 fixed UTC offset (no DST):\n```java\nZoneOffset plus530  = ZoneOffset.of(\"+05:30\");\nZoneOffset utcOff   = ZoneOffset.UTC;\nZoneOffset minus5   = ZoneOffset.ofHours(-5);\n\nOffsetDateTime odt = OffsetDateTime.now(plus530);\n```\n\nConverting LocalDateTime to ZonedDateTime:\n```java\nLocalDateTime local = LocalDateTime.of(2024, 6, 15, 10, 0);\nZonedDateTime zoned = local.atZone(ZoneId.of(\"Asia/Kolkata\"));\nInstant instant     = zoned.toInstant();\n\n// From Instant back to a specific zone\nZonedDateTime inNY  = instant.atZone(ZoneId.of(\"America/New_York\"));\n```"}, {"q": "What is the difference between Duration and Period?", "a": "Duration \u2014 measures time-based amounts (hours, minutes, seconds, nanoseconds):\n```java\nDuration d1 = Duration.ofHours(2);\nDuration d2 = Duration.ofMinutes(90);\nDuration d3 = Duration.ofSeconds(3600);\nDuration d4 = Duration.between(\n    LocalTime.of(9, 0), LocalTime.of(17, 30)); // 8h 30m\n\nd4.toHours();    // 8\nd4.toMinutes();  // 510\nd4.toSeconds();  // 30600\nd4.getSeconds(); // 30600\n\n// With LocalDateTime / Instant\nDuration gap = Duration.between(Instant.now(), Instant.now().plusSeconds(3600));\n```\n\nPeriod \u2014 measures date-based amounts (years, months, days):\n```java\nPeriod p1 = Period.ofYears(1);\nPeriod p2 = Period.of(2, 3, 10); // 2 years, 3 months, 10 days\nPeriod p3 = Period.between(\n    LocalDate.of(2000, 1, 1),\n    LocalDate.of(2024, 6, 15));\n\np3.getYears();   // 24\np3.getMonths();  // 5\np3.getDays();    // 14\n\n// Add/subtract\nLocalDate future = LocalDate.now().plus(Period.ofMonths(6));\n```\n\n\ud83d\udccc Rule of thumb: Duration for time (like a stopwatch), Period for calendar dates (like age)."}, {"q": "What are TemporalAdjusters and how do you use them?", "a": "TemporalAdjusters provide built-in strategies for date adjustments beyond simple arithmetic (first day of month, next Monday, last day of year, etc.).\n\nBuilt-in adjusters:\n```java\nLocalDate date = LocalDate.of(2024, 6, 15);\n\ndate.with(TemporalAdjusters.firstDayOfMonth());   // 2024-06-01\ndate.with(TemporalAdjusters.lastDayOfMonth());    // 2024-06-30\ndate.with(TemporalAdjusters.firstDayOfYear());    // 2024-01-01\ndate.with(TemporalAdjusters.lastDayOfYear());     // 2024-12-31\ndate.with(TemporalAdjusters.firstDayOfNextMonth()); // 2024-07-01\ndate.with(TemporalAdjusters.firstDayOfNextYear());  // 2025-01-01\ndate.with(TemporalAdjusters.next(DayOfWeek.MONDAY));     // next Monday\ndate.with(TemporalAdjusters.previous(DayOfWeek.FRIDAY)); // last Friday\ndate.with(TemporalAdjusters.dayOfWeekInMonth(2, DayOfWeek.TUESDAY)); // 2nd Tuesday of month\n```\n\nCustom TemporalAdjuster:\n```java\n// Custom: next working day (skip weekends)\nTemporalAdjuster nextWorkingDay = temporal -> {\n    DayOfWeek dow = DayOfWeek.of(temporal.get(ChronoField.DAY_OF_WEEK));\n    int daysToAdd = (dow == DayOfWeek.FRIDAY) ? 3\n                  : (dow == DayOfWeek.SATURDAY) ? 2 : 1;\n    return temporal.plus(daysToAdd, ChronoUnit.DAYS);\n};\nLocalDate next = LocalDate.of(2024, 6, 14).with(nextWorkingDay); // Mon June 17\n```"}, {"q": "How do you calculate the difference between two dates/times?", "a": "Using Duration.between() for time-based difference:\n```java\nLocalDateTime start = LocalDateTime.of(2024, 1, 1, 9, 0);\nLocalDateTime end   = LocalDateTime.of(2024, 6, 15, 17, 30);\n\nDuration d = Duration.between(start, end);\nd.toDays();    // 166\nd.toHours();   // 3992\nd.toMinutes(); // 239550\n```\n\nUsing Period.between() for date-based difference:\n```java\nLocalDate dob  = LocalDate.of(1990, 5, 20);\nLocalDate today = LocalDate.now();\nPeriod age = Period.between(dob, today);\nSystem.out.printf(\"Age: %d years, %d months, %d days%n\",\n    age.getYears(), age.getMonths(), age.getDays());\n```\n\nUsing ChronoUnit for simple unit-specific difference:\n```java\nLocalDate d1 = LocalDate.of(2024, 1, 1);\nLocalDate d2 = LocalDate.of(2024, 6, 15);\n\nChronoUnit.DAYS.between(d1, d2);   // 166\nChronoUnit.MONTHS.between(d1, d2); // 5\nChronoUnit.YEARS.between(d1, d2);  // 0\n\n// Works with LocalDateTime and Instant too\nChronoUnit.HOURS.between(LocalTime.of(9,0), LocalTime.of(17,30)); // 8\n```\n\n\ud83d\udccc ChronoUnit.between() is the cleanest way to get a single-unit difference. Use Period for human-readable date diffs (age calculation)."}, {"q": "How do you compare two dates/times in Java?", "a": "All java.time classes implement Comparable and provide intuitive comparison methods.\n\nisAfter(), isBefore(), isEqual():\n```java\nLocalDate d1 = LocalDate.of(2024, 1, 1);\nLocalDate d2 = LocalDate.of(2024, 6, 15);\n\nd1.isBefore(d2); // true\nd1.isAfter(d2);  // false\nd1.isEqual(d2);  // false\n\n// Also works with LocalDateTime, ZonedDateTime, Instant\nInstant t1 = Instant.now();\nInstant t2 = t1.plusSeconds(60);\nt1.isBefore(t2); // true\n```\n\ncompareTo():\n```java\nd1.compareTo(d2); // negative (d1 is before d2)\n```\n\nSorting dates:\n```java\nList<LocalDate> dates = Arrays.asList(\n    LocalDate.of(2024, 3, 1),\n    LocalDate.of(2024, 1, 15),\n    LocalDate.of(2024, 6, 10)\n);\nCollections.sort(dates); // natural order (chronological)\ndates.sort(Comparator.reverseOrder()); // reverse\n```\n\nCheck if date is within a range:\n```java\nLocalDate date  = LocalDate.of(2024, 4, 10);\nLocalDate start = LocalDate.of(2024, 1, 1);\nLocalDate end   = LocalDate.of(2024, 12, 31);\n\nboolean inRange = !date.isBefore(start) && !date.isAfter(end); // true\n```"}, {"q": "How do you convert between legacy Date/Calendar and the new java.time API?", "a": "Java 8 added conversion methods to bridge the old and new APIs.\n\njava.util.Date \u2194 Instant:\n```java\n// Old Date \u2192 Instant\nDate oldDate = new Date();\nInstant instant = oldDate.toInstant();\n\n// Instant \u2192 Old Date\nDate backToDate = Date.from(Instant.now());\n```\n\njava.util.Date \u2194 LocalDateTime:\n```java\n// Date \u2192 LocalDateTime\nLocalDateTime ldt = oldDate.toInstant()\n    .atZone(ZoneId.systemDefault())\n    .toLocalDateTime();\n\n// LocalDateTime \u2192 Date\nDate date = Date.from(\n    ldt.atZone(ZoneId.systemDefault()).toInstant()\n);\n```\n\njava.util.Calendar \u2194 Instant/ZonedDateTime:\n```java\nCalendar cal = Calendar.getInstance();\nInstant inst  = cal.toInstant();\nZonedDateTime zdt = inst.atZone(cal.getTimeZone().toZoneId());\n```\n\njava.sql.Date \u2194 LocalDate (important for JPA/JDBC):\n```java\n// java.sql.Date \u2192 LocalDate\nLocalDate ld = sqlDate.toLocalDate();\n\n// LocalDate \u2192 java.sql.Date\njava.sql.Date sqlDate = java.sql.Date.valueOf(LocalDate.now());\n\n// java.sql.Timestamp \u2194 LocalDateTime\nLocalDateTime ldt2 = timestamp.toLocalDateTime();\njava.sql.Timestamp ts = java.sql.Timestamp.valueOf(LocalDateTime.now());\n```"}, {"q": "How does Java handle daylight saving time (DST) with ZonedDateTime?", "a": "ZonedDateTime uses ZoneId region-based zones that automatically apply DST rules.\n\n```java\nZoneId ny = ZoneId.of(\"America/New_York\");\n\n// Before DST spring-forward (clocks go 2AM \u2192 3AM on Mar 10, 2024)\nZonedDateTime before = ZonedDateTime.of(2024, 3, 10, 1, 30, 0, 0, ny);\nSystem.out.println(before); // 2024-03-10T01:30-05:00[America/New_York]\n\n// 90 minutes later crosses DST boundary\nZonedDateTime after = before.plusMinutes(90);\nSystem.out.println(after);  // 2024-03-10T04:00-04:00[America/New_York]\n// Skipped from 2:00 to 3:00 automatically!\n\n// Adding 1 day respects DST (result is 23 hours later in real time)\nZonedDateTime nextDay = before.plusDays(1);\n```\n\nGap and overlap handling:\n```java\n// Invalid time during spring-forward gap \u2014 Java adjusts automatically\nZonedDateTime gap = ZonedDateTime.of(2024, 3, 10, 2, 30, 0, 0, ny);\n// 2:30 AM doesn't exist \u2014 Java moves it to 3:30 AM\n\n// Ambiguous time during fall-back \u2014 Java picks earlier offset by default\nZonedDateTime overlap = ZonedDateTime.of(2024, 11, 3, 1, 30, 0, 0, ny);\n// Use withEarlierOffsetAtOverlap() or withLaterOffsetAtOverlap() to be explicit\n```\n\n\ud83d\udccc Use ZonedDateTime for user-facing scheduling. Use Instant + UTC for storage \u2014 convert to ZonedDateTime for display."}, {"q": "How do you use the Date/Time API with Java Streams and collections?", "a": "Sorting, filtering, and grouping dates works naturally with Streams.\n\nSorting:\n```java\nList<LocalDate> dates = List.of(\n    LocalDate.of(2024, 6, 15),\n    LocalDate.of(2023, 12, 1),\n    LocalDate.of(2024, 1, 20)\n);\nList<LocalDate> sorted = dates.stream()\n    .sorted()\n    .collect(Collectors.toList()); // chronological\n\n// Reverse\ndates.stream().sorted(Comparator.reverseOrder()).collect(Collectors.toList());\n```\n\nFiltering by date range:\n```java\nLocalDate from = LocalDate.of(2024, 1, 1);\nLocalDate to   = LocalDate.of(2024, 6, 30);\n\nList<LocalDate> inRange = dates.stream()\n    .filter(d -> !d.isBefore(from) && !d.isAfter(to))\n    .collect(Collectors.toList());\n```\n\nGrouping by year/month:\n```java\nMap<Integer, List<LocalDate>> byYear = dates.stream()\n    .collect(Collectors.groupingBy(LocalDate::getYear));\n\nMap<Month, List<LocalDate>> byMonth = dates.stream()\n    .collect(Collectors.groupingBy(LocalDate::getMonth));\n\nMap<YearMonth, List<LocalDate>> byYearMonth = dates.stream()\n    .collect(Collectors.groupingBy(d -> YearMonth.from(d)));\n```\n\nGenerate a range of dates (Java 9+):\n```java\n// Stream of every date in June 2024\nLocalDate start = LocalDate.of(2024, 6, 1);\nstart.datesUntil(start.plusMonths(1)) // Java 9+\n     .filter(d -> d.getDayOfWeek() != DayOfWeek.SATURDAY\n                && d.getDayOfWeek() != DayOfWeek.SUNDAY)\n     .count(); // working days in June\n```"}, {"q": "What is YearMonth and MonthDay and when do you use them?", "a": "YearMonth \u2014 represents a specific year and month (no day):\n```java\nYearMonth ym = YearMonth.of(2024, 6);\nYearMonth now = YearMonth.now();\n\nym.getYear();           // 2024\nym.getMonth();          // JUNE\nym.getMonthValue();     // 6\nym.lengthOfMonth();     // 30 (days in June 2024)\nym.isLeapYear();        // true\nym.atDay(15);           // LocalDate 2024-06-15\nym.atEndOfMonth();      // LocalDate 2024-06-30\n\n// Arithmetic\nym.plusMonths(3);       // 2024-09\nym.minusYears(1);       // 2023-06\n```\n\nUse cases: credit card expiry dates, monthly billing periods, report generation by month.\n\nMonthDay \u2014 represents a month and day (no year):\n```java\nMonthDay md  = MonthDay.of(Month.DECEMBER, 25); // Christmas\nMonthDay birthday = MonthDay.of(6, 15);\n\nmd.getMonth();      // DECEMBER\nmd.getDayOfMonth(); // 25\n\n// Check if today is someone's birthday\nMonthDay today = MonthDay.now();\ntoday.equals(birthday); // true on June 15 regardless of year\n\n// Get this year's occurrence\nmd.atYear(2024); // LocalDate 2024-12-25\n```\n\nUse cases: recurring annual events (birthdays, anniversaries, holidays) where year doesn't matter."}, {"q": "How do you use Clock for testable date/time code?", "a": "java.time.Clock is an abstraction over the system clock, enabling fully deterministic and testable time-dependent code.\n\nWhy use Clock?\n\u2022 LocalDate.now() and Instant.now() call the system clock directly \u2014 hard to test.\n\u2022 By injecting a Clock, you can control the \"current time\" in tests.\n\nProduction code:\n```java\n@Service\npublic class OrderService {\n    private final Clock clock;\n\n    public OrderService(Clock clock) { this.clock = clock; }\n\n    public Order createOrder(Item item) {\n        return new Order(item, LocalDateTime.now(clock)); // uses injected clock\n    }\n}\n```\n\nSpring Boot \u2014 register Clock as a bean:\n```java\n@Configuration\npublic class AppConfig {\n    @Bean\n    public Clock clock() { return Clock.systemDefaultZone(); }\n}\n```\n\nUnit test with fixed clock:\n```java\n@Test\nvoid testOrderTimestamp() {\n    Instant fixedTime = Instant.parse(\"2024-06-15T10:00:00Z\");\n    Clock fixedClock  = Clock.fixed(fixedTime, ZoneId.of(\"UTC\"));\n\n    OrderService service = new OrderService(fixedClock);\n    Order order = service.createOrder(item);\n\n    assertEquals(LocalDateTime.of(2024, 6, 15, 10, 0), order.getCreatedAt());\n}\n```\n\nClock types:\n\u2022 Clock.systemDefaultZone() \u2014 live system clock.\n\u2022 Clock.systemUTC() \u2014 system clock in UTC.\n\u2022 Clock.fixed(instant, zone) \u2014 always returns same time (for tests).\n\u2022 Clock.offset(base, duration) \u2014 shifts a clock by a duration.\n\u2022 Clock.tick(base, duration) \u2014 advances in ticks (e.g. 1-second granularity)."}], "newfeatures": [{"q": "What are the major features introduced in Java 9?", "a": "Java 9 (September 2017) brought several foundational changes:\n\n1. Module System (Project Jigsaw):\n   Split the JDK into named modules. Applications declare their dependencies via module-info.java.\n\n2. JShell (REPL):\n   Interactive read-eval-print loop for testing Java snippets without writing a full class.\n\n3. Collection Factory Methods:\n```java\nList<String> list = List.of(\"A\", \"B\", \"C\");\nSet<String>  set  = Set.of(\"X\", \"Y\");\nMap<String, Integer> map = Map.of(\"one\", 1, \"two\", 2);\n```\n\n4. Stream API improvements: takeWhile(), dropWhile(), ofNullable(), iterate() with predicate.\n5. Optional improvements: ifPresentOrElse(), or(), stream().\n6. Private methods in interfaces.\n7. Improved try-with-resources (effectively final variables).\n8. HTTP/2 Client (incubator \u2014 finalized in Java 11)."}, {"q": "What is the Java Module System (JPMS) introduced in Java 9?", "a": "JPMS (Java Platform Module System) organizes code into named modules with explicit dependencies and exports.\n\nEach module has a module-info.java descriptor:\n```java\n// module-info.java\nmodule com.myapp.orders {\n    requires com.myapp.products;     // declares dependency\n    requires java.sql;\n    exports com.myapp.orders.api;    // exposes package to others\n    opens com.myapp.orders.model to  // opens for reflection (e.g. Hibernate)\n        hibernate.core;\n}\n```\n\nBenefits:\n\u2022 Strong encapsulation \u2014 internal packages are hidden by default.\n\u2022 Reliable configuration \u2014 missing dependencies fail at startup, not runtime.\n\u2022 Smaller runtime images \u2014 only include modules your app needs (jlink).\n\n\ud83d\udccc Most Spring Boot / enterprise apps still run on the classpath (unnamed module) and don't require module-info.java unless building modular libraries."}, {"q": "What are the new Stream API methods added in Java 9?", "a": "Java 9 added four new methods to the Stream API:\n\n1. takeWhile(predicate) \u2014 takes elements while predicate is true, stops at first false:\n```java\nStream.of(1, 2, 3, 4, 5, 1, 2)\n      .takeWhile(n -> n < 4)\n      .forEach(System.out::print); // 1 2 3\n```\n\n2. dropWhile(predicate) \u2014 drops elements while predicate is true, then takes the rest:\n```java\nStream.of(1, 2, 3, 4, 5)\n      .dropWhile(n -> n < 4)\n      .forEach(System.out::print); // 4 5\n```\n\n3. iterate(seed, predicate, next) \u2014 finite iteration with a stop condition:\n```java\nStream.iterate(0, n -> n < 10, n -> n + 2)\n      .forEach(System.out::print); // 0 2 4 6 8\n```\n\n4. ofNullable(value) \u2014 returns empty stream if null, else single-element stream:\n```java\nStream.ofNullable(null).count();    // 0\nStream.ofNullable(\"hi\").count();    // 1\n```"}, {"q": "What major features were introduced in Java 10 and Java 11?", "a": "Java 10 (March 2018):\n\u2022 var \u2014 Local Variable Type Inference:\n```java\nvar list = new ArrayList<String>(); // inferred as ArrayList<String>\nvar map  = new HashMap<String, Integer>();\nfor (var entry : map.entrySet()) { ... }\n```\n\u2022 Unmodifiable collection copies: List.copyOf(), Set.copyOf(), Map.copyOf()\n\u2022 Collectors.toUnmodifiableList()\n\nJava 11 (September 2018 \u2014 LTS):\n\u2022 String new methods:\n```java\n\"  hello  \".strip();        // \"hello\" (Unicode-aware trim)\n\"  \".isBlank();             // true\n\"hi\nworld\".lines()         // Stream<String>\n\"ab\".repeat(3);             // \"ababab\"\n```\n\u2022 var in lambda parameters: (var x, var y) -> x + y\n\u2022 HttpClient finalized (async, HTTP/2 support):\n```java\nHttpClient client = HttpClient.newHttpClient();\nHttpRequest req = HttpRequest.newBuilder(URI.create(\"https://api.example.com\")).build();\nHttpResponse<String> res = client.send(req, BodyHandlers.ofString());\n```\n\u2022 Files.readString() / Files.writeString()\n\u2022 Running Java files directly: java HelloWorld.java"}, {"q": "What are the key features introduced in Java 14, 15, and 16?", "a": "Java 14 (March 2020):\n\u2022 Switch Expressions (standard \u2014 preview in 12/13):\n```java\nString result = switch (day) {\n    case MONDAY, FRIDAY -> \"Weekday\";\n    case SATURDAY, SUNDAY -> \"Weekend\";\n    default -> \"Other\";\n};\n```\n\u2022 Helpful NullPointerExceptions \u2014 detailed NPE messages: \"Cannot read field 'name' because 'user' is null\".\n\u2022 Records (preview \u2014 standard in Java 16).\n\nJava 15 (September 2020):\n\u2022 Text Blocks (standard \u2014 preview in 13/14):\n```java\nString json = \"\"\"\n    {\n        \"name\": \"Alice\",\n        \"age\": 30\n    }\n    \"\"\";\n```\n\u2022 Sealed Classes (preview \u2014 standard in Java 17).\n\nJava 16 (March 2021):\n\u2022 Records (standard):\n```java\nrecord Point(int x, int y) {}\nPoint p = new Point(3, 4);\np.x(); // 3\n```\n\u2022 Pattern Matching for instanceof (standard):\n```java\nif (obj instanceof String s) {\n    System.out.println(s.toUpperCase()); // no cast needed\n}\n```"}, {"q": "What are the major features in Java 17 (LTS)?", "a": "Java 17 (September 2021) is an LTS release with several important finalized features:\n\n1. Sealed Classes (standard):\n```java\npublic sealed interface Shape permits Circle, Rectangle, Triangle {}\npublic record Circle(double radius) implements Shape {}\npublic record Rectangle(double w, double h) implements Shape {}\n```\n\n2. Pattern Matching for instanceof (standard):\n```java\nObject obj = \"Hello\";\nif (obj instanceof String s && s.length() > 3) {\n    System.out.println(s.toUpperCase());\n}\n```\n\n3. Text Blocks (standard since 15 \u2014 widely used by 17).\n\n4. Strong Encapsulation of JDK Internals \u2014 internal APIs no longer accessible via reflection.\n\n5. Enhanced Pseudo-Random Number Generators \u2014 new RandomGenerator interface and algorithms (Xoshiro, LCG, etc.).\n\n6. Removal of: Applet API, Security Manager, RMI Activation.\n\n\ud83d\udccc Java 17 is the current most widely adopted LTS. Spring Boot 3.x requires Java 17+."}, {"q": "What is Pattern Matching in Java? Explain instanceof and switch patterns.", "a": "Pattern Matching eliminates redundant casting and enables expressive type-based branching.\n\nPattern Matching for instanceof (Java 16):\n```java\n// Old way\nif (obj instanceof String) {\n    String s = (String) obj;\n    System.out.println(s.length());\n}\n\n// New way\nif (obj instanceof String s) {\n    System.out.println(s.length()); // s is already cast\n}\n\n// With guard condition\nif (obj instanceof String s && s.length() > 5) {\n    System.out.println(\"Long string: \" + s);\n}\n```\n\nPattern Matching in switch (Java 21 \u2014 standard):\n```java\nstatic double area(Shape shape) {\n    return switch (shape) {\n        case Circle c    -> Math.PI * c.radius() * c.radius();\n        case Rectangle r -> r.width() * r.height();\n        case Triangle t  -> 0.5 * t.base() * t.height();\n    };\n}\n```\n\n\ud83d\udccc Sealed classes + switch pattern matching = exhaustive, compiler-checked type dispatch with zero casts."}, {"q": "What are Records in Java and what are their limitations?", "a": "Records (Java 16) are concise, immutable data carrier classes. The compiler auto-generates constructor, accessors, equals(), hashCode(), and toString().\n\n```java\nrecord Person(String name, int age) {}\n\n// Equivalent to a class with:\n// - final fields: name, age\n// - canonical constructor\n// - accessors: name(), age()  (not getName())\n// - equals, hashCode, toString\n\nPerson p = new Person(\"Alice\", 30);\np.name();    // \"Alice\"\np.age();
